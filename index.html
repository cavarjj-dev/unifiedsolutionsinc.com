// ─── SESSION GENERATOR ─────────────────────────────────────────────────────
// Builds a fresh, randomized 18-question set each time the assessment starts:
// • Randomly selects 3 of 5 questions per domain
// • Randomizes domain order (so identity isn't always first)
// • Shuffles answer options (so best answer isn't always position A)
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateAssessmentSession() {
  const allQuestions = [...QUESTIONS, ...QUESTION_POOL_EXTRA];
  const domainOrder = shuffleArray([...DOMAINS.map(d => d.id)]);
  const session = [];
  let qNum = 1;
  domainOrder.forEach(domainId => {
    const pool = allQuestions.filter(q => q.domain === domainId);
    const selected = shuffleArray(pool).slice(0, 3);
    selected.forEach(q => {
      session.push({
        ...q,
        sessionId: qNum++,
        options: shuffleArray([...q.options]) // shuffle so A isn't always best
      });
    });
  });
  return session;
}

function Btn({ children, variant="gold", onClick, href, style={} }) {
  const base = { fontFamily:DM, fontWeight:600, fontSize:16, letterSpacing:1, textTransform:"uppercase", padding:"12px 28px", borderRadius:2, cursor:"pointer", border:"none", transition:"all 0.2s", display:"inline-block", textDecoration:"none" };
  const variants = {
    gold:  { background:C.gold, color:C.white, ...base },
    ghost: { background:"transparent", color:C.gold, border:`1px solid ${C.gold}`, ...base },
    navy:  { background:C.navy, color:C.white, ...base },
    white: { background:"transparent", color:C.white, border:`1px solid rgba(255,255,255,0.5)`, ...base },
  };
  const s = { ...variants[variant], ...style };
  if (href) return <a href={href} target="_blank" rel="noopener noreferrer" style={s}>{children}</a>;
  return <button style={s} onClick={onClick}>{children}</button>;
}

function Divider({ color = C.border }) {
  return <div style={{ height:1, background:color, width:"100%", margin:"0" }} />;
}

function EditableBlock({ text, onSave, tag:Tag="p", style={}, fieldName="content" }) {
  const { editMode, isAdmin } = useSite();
  const ref = useRef(null);
  if (!editMode || !isAdmin) return <Tag style={style}>{text}</Tag>;

  function handleSave(newText) {
    if (newText === text) return;
    // Log the change
    try {
      const log = JSON.parse(localStorage.getItem('cms-change-log') || '[]');
      log.push({ timestamp: new Date().toISOString(), field: fieldName, oldValue: text, newValue: newText });
      if (log.length > 500) log.splice(0, log.length - 500); // cap at 500 entries
      localStorage.setItem('cms-change-log', JSON.stringify(log));
    } catch(e) {}
    onSave(newText);
  }

  return (
    <Tag
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      style={{ ...style, outline:`2px dashed ${C.gold}`, outlineOffset:2, minHeight:"1em", cursor:"text" }}
      onBlur={e => handleSave(e.currentTarget.innerText)}
    >
      {text}
    </Tag>
  );
}

function ScoreBadge({ score }) {
  const color = score >= 75 ? C.green : score >= 50 ? C.gold : C.red;
  const label = score >= 75 ? "Strong" : score >= 50 ? "Developing" : "Priority Area";
  return <span style={{ background:`${color}18`, color, border:`1px solid ${color}40`, fontSize:12, fontWeight:700, padding:"2px 8px", borderRadius:10, letterSpacing:1, fontFamily:DM }}>{label}</span>;
}

// ADMIN LOGIN MODAL (secret entry: Ctrl+Shift+A)
// ═══════════════════════════════════════════════════════
function AdminLoginModal() {
  const { setShowAdminModal, handleAdminLogin } = useSite();
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [attempts, setAttempts] = useState(() => {
    try { return JSON.parse(localStorage.getItem('us-login-attempts') || '{"count":0,"lockUntil":0}'); }
    catch(e) { return {count:0, lockUntil:0}; }
  });
  const [loading, setLoading] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { inputRef.current?.focus(); }, []);

  const isLocked = attempts.lockUntil > Date.now();
  const lockMins = Math.ceil((attempts.lockUntil - Date.now()) / 60000);

  async function attempt() {
    if (isLocked || loading || !pin) return;
    setLoading(true);
    const ok = await handleAdminLogin(pin);
    if (ok) {
      localStorage.setItem('us-login-attempts', JSON.stringify({count:0, lockUntil:0}));
    } else {
      const newCount = attempts.count + 1;
      const lockUntil = newCount >= 5 ? Date.now() + 900000 : 0;
      const newAttempts = {count: newCount, lockUntil};
      localStorage.setItem('us-login-attempts', JSON.stringify(newAttempts));
      setAttempts(newAttempts);
      setError(newCount >= 5 ? 'Too many attempts. Locked for 15 minutes.' : `Incorrect PIN. ${5 - newCount} attempt${5-newCount===1?'':'s'} remaining.`);
      setPin('');
    }
    setLoading(false);
  }

  return (
    <div style={{ position:"fixed", inset:0, zIndex:1000, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"center", justifyContent:"center" }}
      onClick={e => e.target === e.currentTarget && setShowAdminModal(false)}>
      <div style={{ background:C.navy, borderRadius:8, padding:40, width:340, boxShadow:"0 32px 80px rgba(0,0,0,0.6)", border:`1px solid ${C.navyLight}` }}>
        <div style={{ fontFamily:DM, fontSize:11, letterSpacing:3, textTransform:"uppercase", color:C.gold, marginBottom:16 }}>Unified Solutions Inc.</div>
        <div style={{ fontFamily:PF, fontSize:22, color:C.white, marginBottom:8 }}>Admin Access</div>
        <div style={{ fontFamily:DM, fontSize:14, color:"rgba(255,255,255,0.4)", marginBottom:28 }}>Session expires after 1 hour of inactivity.</div>
        {isLocked ? (
          <div style={{ fontFamily:DM, fontSize:16, color:"#E07070", background:"rgba(155,34,38,0.2)", borderRadius:4, padding:"12px 16px" }}>
            Access locked. Try again in {lockMins} minute{lockMins===1?'':'s'}.
          </div>
        ) : (
          <>
            <input
              ref={inputRef} type="password" value={pin}
              onChange={e => { setPin(e.target.value); setError(''); }}
              onKeyDown={e => e.key==='Enter' && attempt()}
              placeholder="Enter admin PIN"
              style={{ width:"100%", padding:"12px 14px", fontFamily:DM, fontSize:16, background:"rgba(255,255,255,0.08)", border:`1px solid ${error ? '#E07070' : 'rgba(255,255,255,0.15)'}`, borderRadius:4, color:C.white, letterSpacing:4, marginBottom:8, outline:"none" }}
            />
            {error && <div style={{ fontFamily:DM, fontSize:14, color:"#E07070", marginBottom:12 }}>{error}</div>}
            <button onClick={attempt} disabled={loading || !pin} style={{ width:"100%", background:C.gold, color:C.white, border:"none", borderRadius:4, padding:"12px", fontFamily:DM, fontWeight:700, fontSize:16, cursor: loading||!pin?"not-allowed":"pointer", opacity: loading||!pin?0.6:1, marginTop:8 }}>
              {loading ? "Verifying..." : "Unlock"}
            </button>
            <button onClick={() => setShowAdminModal(false)} style={{ width:"100%", background:"none", border:"none", fontFamily:DM, fontSize:14, color:"rgba(255,255,255,0.3)", cursor:"pointer", marginTop:12, padding:4 }}>Cancel</button>
          </>
        )}
      </div>
    </div>
  );
}

  function clearLog() {
    if (window.confirm('Clear all change log entries?')) {
      localStorage.setItem('cms-change-log', '[]');
      setChangeLog([]);
    }
  }

  return (
    <>

          </button>
          {editMode && <button onClick={saveContent} style={{ background:C.white, color:C.gold, border:"none", borderRadius:2, padding:"4px 14px", fontFamily:DM, fontWeight:700, fontSize:13, cursor:"pointer" }}>Save</button>}

        </div>
      </div>
      {showLog && (
        <div style={{ position:"fixed", top:40, right:0, zIndex:490, width:520, maxHeight:"70vh", background:C.navy, border:`1px solid ${C.navyLight}`, borderRadius:"0 0 0 8px", overflowY:"auto", boxShadow:"-8px 8px 32px rgba(0,0,0,0.4)" }}>

            <div style={{ display:"flex", gap:8 }}>

              <button onClick={() => setShowLog(false)} style={{ background:"none", border:"none", color:"rgba(255,255,255,0.5)", fontSize:18, cursor:"pointer" }}>×</button>
            </div>
          </div>
          {changeLog.length === 0 ? (
            <div style={{ padding:24, fontFamily:DM, fontSize:16, color:"rgba(255,255,255,0.4)", textAlign:"center" }}>No changes logged yet.</div>
          ) : [...changeLog].reverse().map((entry, i) => (
            <div key={i} style={{ padding:"12px 20px", borderBottom:`1px solid rgba(255,255,255,0.06)` }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                <span style={{ fontFamily:DM, fontSize:12, letterSpacing:1, color:C.gold, textTransform:"uppercase" }}>{entry.field}</span>
                <span style={{ fontFamily:DM, fontSize:12, color:"rgba(255,255,255,0.35)" }}>{new Date(entry.timestamp).toLocaleString()}</span>
              </div>
              <div style={{ fontFamily:DM, fontSize:13, color:"rgba(255,255,255,0.4)", marginBottom:3 }}>
                <span style={{ color:"#E07070" }}>−</span> {entry.oldValue?.substring(0,80)}{entry.oldValue?.length > 80 ? '...' : ''}
              </div>
              <div style={{ fontFamily:DM, fontSize:13, color:"rgba(255,255,255,0.7)" }}>
                <span style={{ color:"#5DE09A" }}>+</span> {entry.newValue?.substring(0,80)}{entry.newValue?.length > 80 ? '...' : ''}
              </div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// ADMIN PANEL (PIN-protected CRM dashboard)
// ═══════════════════════════════════════════════════════
// Admin PIN removed — authentication now handled by secure admin session (Ctrl+Shift+A)

function AdminPanel({ onClose }) {
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("us-api-key") || "");
  const [selected, setSelected] = useState(null);
  const [notionStatus, setNotionStatus] = useState({});

  useEffect(() => { loadRecords(); }, []);

  async function loadRecords() {
    setLoading(true);
    try {
      const r = await storage.get("assessment-results");
      if (r) setRecords(JSON.parse(r.value));
    } catch (e) {}
    setLoading(false);
  }

  async function syncToNotion(record, idx) {
    setNotionStatus(prev => ({...prev, [idx]: "syncing"}));
    try {
      const primary = Object.entries(record.scores).sort((a,b) => a[1]-b[1])[0];
      const domain = DOMAINS.find(d => d.id === primary[0]);
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          mcp_servers: [{ type: "url", url: "https://mcp.notion.com/mcp", name: "notion" }],
          messages: [{ role: "user", content: `Create a new page in the Notion database called "Coaching Contacts — Unified Solutions CRM" with these properties:
- Name/Title: "${record.email || "Anonymous"}"
- Email: "${record.email || ""}"
- Assessment Date: "${record.timestamp}"
- Primary Pressure Point: "${domain?.label || ""}"
- Identity Score: ${record.scores.identity || 0}
- Decision Score: ${record.scores.decision || 0}
- Relational Score: ${record.scores.relational || 0}
- Team Score: ${record.scores.team || 0}
- Sustainability Score: ${record.scores.sustainability || 0}
- Strategic Score: ${record.scores.strategic || 0}
- Status: "New Lead"
Confirm when done.` }]
        })
      });
      const data = await response.json();
      const text = data.content?.filter(b => b.type === "text").map(b => b.text).join("") || "";
      setNotionStatus(prev => ({...prev, [idx]: text.toLowerCase().includes("error") ? "error" : "synced"}));
    } catch (e) {
      setNotionStatus(prev => ({...prev, [idx]: "error"}));
    }
  }

  async function clearAll() {
    if (window.confirm("Delete all locally stored assessment records? This cannot be undone.")) {
      await storage.set("assessment-results", JSON.stringify([]));
      setRecords([]);
    }
  }

  const tableHead = { fontFamily:DM, fontSize:12, letterSpacing:2, textTransform:"uppercase", color:C.muted, padding:"10px 12px", borderBottom:`2px solid ${C.border}`, textAlign:"left" };
  const tableCell = { fontFamily:DM, fontSize:16, padding:"12px", borderBottom:`1px solid ${C.border}` };

  return (
    <div style={{ position:"fixed", inset:0, zIndex:500, background:"rgba(0,0,0,0.7)", display:"flex", alignItems:"flex-start", justifyContent:"center", overflowY:"auto", paddingTop:20 }}>
      <div style={{ background:C.cream, borderRadius:8, width:"95%", maxWidth:1000, maxHeight:"92vh", overflowY:"auto", boxShadow:"0 32px 80px rgba(0,0,0,0.5)" }}>
        {/* Header */}
        <div style={{ background:C.navy, padding:"24px 32px", display:"flex", justifyContent:"space-between", alignItems:"center", position:"sticky", top:0, zIndex:10 }}>
          <div>
            <div style={{ fontFamily:DM, fontSize:12, letterSpacing:3, textTransform:"uppercase", color:C.gold, marginBottom:4 }}>Secure Admin Dashboard</div>
            <div style={{ fontFamily:PF, fontSize:22, color:C.white }}>Assessment CRM — Unified Solutions Inc.</div>
          </div>
          <div style={{ display:"flex", gap:10, alignItems:"center" }}>
            <span style={{ fontFamily:DM, fontSize:14, color:"rgba(255,255,255,0.5)" }}>{records.length} record{records.length!==1?"s":""}</span>
            <button onClick={loadRecords} style={{ background:"rgba(255,255,255,0.1)", border:"1px solid rgba(255,255,255,0.2)", color:C.white, fontFamily:DM, fontSize:14, padding:"6px 14px", borderRadius:2, cursor:"pointer" }}>↻ Refresh</button>
            <button onClick={clearAll} style={{ background:"rgba(155,34,38,0.3)", border:"1px solid rgba(155,34,38,0.5)", color:"#ffaaaa", fontFamily:DM, fontSize:14, padding:"6px 14px", borderRadius:2, cursor:"pointer" }}>Clear All</button>
            <button onClick={onClose} style={{ background:C.gold, border:"none", color:C.white, fontFamily:DM, fontSize:16, fontWeight:700, padding:"8px 18px", borderRadius:2, cursor:"pointer" }}>Close ×</button>
          </div>
        </div>

        <div style={{ padding:"16px 32px", borderBottom:"1px solid rgba(255,255,255,0.1)" }}>
          <div style={{ background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:4, padding:"10px 16px", display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
            <span style={{ fontFamily:DM, fontSize:12, letterSpacing:2, textTransform:"uppercase", color:"rgba(255,255,255,0.4)" }}>Anthropic API Key</span>
            <input
              type="password" value={apiKey}
              onChange={e => { setApiKey(e.target.value); localStorage.setItem("us-api-key", e.target.value); }}
              placeholder="sk-ant-..."
              style={{ flex:1, minWidth:200, padding:"5px 10px", fontFamily:DM, fontSize:14, background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:2, color:"white" }}
            />
            {apiKey && <span style={{ fontFamily:DM, fontSize:13, color:"#5DE09A" }}>✓ Key saved</span>}
          </div>
        </div>
        <div style={{ padding:32 }}>
          {/* Stats row */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:16, marginBottom:32 }}>
            {[
              { label:"Total Submissions", val: records.length },
              { label:"With Email (Leads)", val: records.filter(r => r.email).length },
              { label:"Synced to Notion", val: Object.values(notionStatus).filter(s => s==="synced").length },
              { label:"Avg. Lowest Domain", val: records.length ? (() => {
                const counts = {}; DOMAINS.forEach(d => counts[d.id]=0);
                records.forEach(r => { const low = Object.entries(r.scores).sort((a,b)=>a[1]-b[1])[0]; if (low) counts[low[0]]++; });
                const topDomain = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
                return DOMAINS.find(d=>d.id===topDomain?.[0])?.label.split(" ")[0] || "—";
              })() : "—" },
            ].map((s,i) => (
              <div key={i} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:4, padding:"16px 20px" }}>
                <div style={{ fontFamily:PF, fontSize:28, color:C.navy, fontWeight:700 }}>{s.val}</div>
                <div style={{ fontFamily:DM, fontSize:12, letterSpacing:1, textTransform:"uppercase", color:C.muted, marginTop:4 }}>{s.label}</div>
              </div>
            ))}
          </div>

          {loading ? (
            <div style={{ textAlign:"center", padding:40, fontFamily:DM, color:C.muted }}>Loading records...</div>
          ) : records.length === 0 ? (
            <div style={{ textAlign:"center", padding:60, background:C.white, border:`1px solid ${C.border}`, borderRadius:4 }}>
              <div style={{ fontFamily:PF, fontSize:24, color:C.navy, marginBottom:8 }}>No submissions yet.</div>
              <div style={{ fontFamily:DM, fontSize:16, color:C.muted }}>Assessment results will appear here when users submit their email or save results.</div>
            </div>
          ) : (
            <>
              <table style={{ width:"100%", borderCollapse:"collapse", background:C.white, border:`1px solid ${C.border}`, borderRadius:4, overflow:"hidden" }}>
                <thead>
                  <tr style={{ background:C.creamDark }}>
                    <th style={tableHead}>Date</th>
                    <th style={tableHead}>Email</th>
                    <th style={tableHead}>Primary Pressure Point</th>
                    <th style={tableHead}>Scores</th>
                    <th style={tableHead}>Notion</th>
                    <th style={tableHead}>Detail</th>
                  </tr>
                </thead>
                <tbody>
                  {[...records].reverse().map((r, i) => {
                    const idx = records.length - 1 - i;
                    const sorted = Object.entries(r.scores).sort((a,b)=>a[1]-b[1]);
                    const primary = DOMAINS.find(d=>d.id===sorted[0]?.[0]);
                    const ns = notionStatus[idx];
                    return (
                      <tr key={i} style={{ background: selected===idx ? C.goldPale : "transparent" }}>
                        <td style={tableCell}>{new Date(r.timestamp).toLocaleDateString()}</td>
                        <td style={tableCell}>{r.email || <span style={{color:C.muted,fontStyle:"italic"}}>anonymous</span>}</td>
                        <td style={tableCell}>
                          <span style={{ display:"inline-flex", alignItems:"center", gap:6 }}>
                            <span style={{ color:primary?.color }}>{primary?.icon}</span>
                            <span style={{ fontWeight:600, color:C.navy }}>{primary?.label}</span>
                          </span>
                        </td>
                        <td style={tableCell}>
                          <div style={{ display:"flex", gap:4 }}>
                            {DOMAINS.map(d => (
                              <div key={d.id} title={`${d.label}: ${r.scores[d.id]}`} style={{ width:20, height:20, background:d.color, opacity: (r.scores[d.id]||0)/100 * 0.8 + 0.2, borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}>
                                <span style={{ fontSize:11, color:C.white, fontWeight:700 }}>{r.scores[d.id]}</span>
                              </div>
                            ))}
                          </div>
                        </td>
                        <td style={tableCell}>
                          {ns === "synced" ? <span style={{ color:C.green, fontFamily:DM, fontSize:14 }}>✓ Synced</span>
                          : ns === "syncing" ? <span style={{ color:C.gold, fontFamily:DM, fontSize:14 }}>Syncing...</span>
                          : ns === "error" ? <span style={{ color:C.red, fontFamily:DM, fontSize:14 }}>Error</span>
                          : <button onClick={() => syncToNotion(r, idx)} style={{ background:"none", border:`1px solid ${C.gold}`, color:C.gold, fontFamily:DM, fontSize:13, padding:"3px 10px", borderRadius:2, cursor:"pointer" }}>Sync</button>}
                        </td>
                        <td style={tableCell}>
                          <button onClick={() => setSelected(selected===idx?null:idx)} style={{ background:"none", border:`1px solid ${C.border}`, fontFamily:DM, fontSize:13, padding:"3px 10px", borderRadius:2, cursor:"pointer", color:C.navy }}>
                            {selected===idx ? "Hide" : "View"}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {/* Detail expand */}
              {selected !== null && records[selected] && (
                <div style={{ marginTop:16, background:C.white, border:`2px solid ${C.gold}`, borderRadius:4, padding:28 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
                    <div style={{ fontFamily:PF, fontSize:20, color:C.navy }}>Detail View — {records[selected].email || "Anonymous"}</div>
                    <div style={{ fontFamily:DM, fontSize:14, color:C.muted }}>{new Date(records[selected].timestamp).toLocaleString()}</div>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
                    {DOMAINS.map(d => {
                      const score = records[selected].scores[d.id] || 0;
                      return (
                        <div key={d.id} style={{ background:C.cream, borderRadius:4, padding:"14px 16px" }}>
                          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:8 }}>
                            <span style={{ color:d.color }}>{d.icon}</span>
                            <span style={{ fontFamily:DM, fontSize:13, fontWeight:600, color:C.navy }}>{d.label}</span>
                          </div>
                          <div style={{ background:C.border, borderRadius:2, height:6, marginBottom:4 }}>
                            <div style={{ width:`${score}%`, height:"100%", background:d.color, borderRadius:2 }} />
                          </div>
                          <div style={{ fontFamily:DM, fontSize:14, color:C.muted }}>{score}/100 · <ScoreBadge score={score} /></div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </>
          )}
          <div style={{ marginTop:24, background:C.navyMid, borderRadius:4, padding:"14px 20px", display:"flex", gap:12, alignItems:"center" }}>
            <span style={{ fontSize:18 }}>💡</span>
            <div style={{ fontFamily:DM, fontSize:14, color:"rgba(255,255,255,0.65)", lineHeight:1.6 }}>
              <strong style={{ color:C.gold }}>Notion Sync:</strong> Click "Sync" on any record to push it to your "Coaching Contacts — Unified Solutions CRM" database. Records with email opt-in also create a Gmail draft notification. Data is always backed up locally in persistent storage.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ASSESSMENT PAGE
// ═══════════════════════════════════════════════════════
function AssessmentPage() {
  const { setPage, content, updateContent, isAdmin, setShowAdminModal } = useSite();
  const [answers, setAnswers] = useState({});
  const [step, setStep] = useState("intro"); // intro | quiz | results
  // Generated fresh each session — randomized domain order, question selection, option order
  const [sessionQuestions, setSessionQuestions] = useState([]);
  const [email, setEmail] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [savedMsg, setSavedMsg] = useState(null);
  const [showAdmin, setShowAdmin] = useState(false);
  const current = Object.keys(answers).length;
  const totalQs = sessionQuestions.length || 18;
  const progress = Math.round((current / totalQs) * 100);

  function computeScores() {
    const scores = {};
    DOMAINS.forEach(d => {
      const qs = sessionQuestions.filter(q => q.domain === d.id);
      if (qs.length === 0) { scores[d.id] = 50; return; }
      const total = qs.reduce((acc, q) => acc + (answers[q.sessionId] ?? 0), 0);
      scores[d.id] = Math.round(((total - qs.length) / (qs.length * 3)) * 100);
    });
    return scores;
  }

  async function saveResults(scores) {
    try {
      const record = { timestamp: new Date().toISOString(), email, scores, answers };
      const existing = [];
      try {
        const r = await storage.get("assessment-results");
        if (r) existing.push(...JSON.parse(r.value));
      } catch (e) {}
      existing.push(record);
      await storage.set("assessment-results", JSON.stringify(existing));
      setSavedMsg("Results saved ✓");
    } catch (e) { setSavedMsg("Save failed — storage unavailable"); }
  }

  const allAnswered = sessionQuestions.length > 0 && current === sessionQuestions.length;

  // Admin panel access now secured by global admin session
  if (showAdmin && isAdmin) return <AdminPanel onClose={() => setShowAdmin(false)} />;
  if (showAdmin && !isAdmin) { setShowAdmin(false); setShowAdminModal(true); }

  if (step === "intro") return (
    <div style={{ paddingTop:64, background:C.cream, minHeight:"100vh" }}>
      <section style={{ background:C.navy, padding:"80px 24px 64px" }}>
        <div style={{ maxWidth:720, margin:"0 auto", textAlign:"center" }}>
          <div style={{ fontFamily:DM, fontSize:12, letterSpacing:3, color:C.gold, textTransform:"uppercase", marginBottom:16 }}>Free Diagnostic</div>
          <EditableBlock text={content.assessment?.headline||"Where is the gap between where you are and where you need to be costing you most?"} onSave={v=>updateContent("assessment.headline",v)} fieldName="assessment.headline" tag="h1" style={{ fontFamily:PF, fontSize:44, color:C.white, margin:"0 0 20px", letterSpacing:-0.5 }} />
          <EditableBlock text={content.assessment?.subtitle||"18 behaviorally-anchored questions across 6 validated leadership domains. No right answers — honest answers only. Under 8 minutes. Free, no email required to see your result."} onSave={v=>updateContent("assessment.subtitle",v)} fieldName="assessment.subtitle" tag="p" style={{ fontFamily:DM, fontSize:18, color:"rgba(255,255,255,0.65)", lineHeight:1.7, margin:"0 0 40px" }} />
          <div style={{ display:"flex", gap:32, justifyContent:"center", marginBottom:40 }}>
            {[["18","Questions"],["6","Domains"],["<8 min","To complete"],["Free","No signup"]].map(([v,l]) => (
              <div key={l} style={{ textAlign:"center" }}>
                <div style={{ fontFamily:PF, fontSize:28, color:C.gold, fontWeight:700 }}>{v}</div>
                <div style={{ fontFamily:DM, fontSize:12, letterSpacing:2, color:"rgba(255,255,255,0.5)", textTransform:"uppercase" }}>{l}</div>
              </div>
            ))}
          </div>
          <Btn onClick={() => setStep("quiz")} style={{ fontSize:17, padding:"16px 48px" }}>Begin Assessment</Btn>
          {isAdmin && (
            <div style={{ marginTop:20 }}>
              <button onClick={() => setShowAdmin(true)} style={{ background:"rgba(200,147,58,0.15)", border:`1px solid ${C.gold}40`, borderRadius:2, fontFamily:DM, fontSize:13, color:C.gold, padding:"6px 16px", cursor:"pointer", letterSpacing:1 }}>
                📊 View Assessment CRM
              </button>
            </div>
          )}

        </div>
      </section>
      <section style={{ padding:"64px 24px" }}>
        <div style={{ maxWidth:800, margin:"0 auto", display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:24 }}>
          {DOMAINS.map(d => (
            <div key={d.id} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:4, padding:24 }}>
              <div style={{ fontFamily:DM, fontSize:24, marginBottom:12, color:d.color }}>{d.icon}</div>
              <div style={{ fontFamily:PF, fontSize:18, color:C.navy, fontWeight:600, marginBottom:8 }}>{d.label}</div>
              <div style={{ fontFamily:DM, fontSize:16, color:C.muted, lineHeight:1.6 }}>{d.desc}</div>
            </div>
          ))}
        </div>
      </section>
    </div>
  );

  if (step === "quiz") {
    const qIndex = sessionQuestions.findIndex(q => !answers[q.sessionId]);
    const q = qIndex >= 0 ? sessionQuestions[qIndex] : null;
    const domain = q ? DOMAINS.find(d => d.id === q.domain) : null;
    return (
      <div style={{ paddingTop:64, background:C.cream, minHeight:"100vh" }}>
        <div style={{ background:C.white, borderBottom:`1px solid ${C.border}`, padding:"16px 24px" }}>
          <div style={{ maxWidth:720, margin:"0 auto", display:"flex", alignItems:"center", gap:16 }}>
            <span style={{ fontFamily:DM, fontSize:14, color:C.muted, whiteSpace:"nowrap" }}>Question {current+1} of {totalQs}</span>
            <div style={{ flex:1, background:C.creamDark, borderRadius:2, height:6 }}>
              <div style={{ width:`${progress}%`, height:"100%", background:C.gold, borderRadius:2, transition:"width 0.3s" }} />
            </div>
            <span style={{ fontFamily:DM, fontSize:14, color:C.gold, fontWeight:600, whiteSpace:"nowrap" }}>{progress}%</span>
          </div>
        </div>
        {!allAnswered && q ? (
          <section style={{ padding:"64px 24px" }}>
            <div style={{ maxWidth:640, margin:"0 auto" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:28 }}>
                <span style={{ fontFamily:DM, fontSize:20, color:domain.color }}>{domain.icon}</span>
                <span style={{ fontFamily:DM, fontSize:13, letterSpacing:2, color:domain.color, textTransform:"uppercase" }}>{domain.label}</span>
              </div>
              <h2 style={{ fontFamily:PF, fontSize:26, color:C.navy, margin:"0 0 36px", lineHeight:1.4 }}>{q.text}</h2>
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                {q.options.map((opt,i) => (
                  <button key={i} onClick={() => { setAnswers(prev => ({...prev, [q.sessionId]: opt.score})); }}
                    style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:4, padding:"18px 24px", textAlign:"left", cursor:"pointer", fontFamily:DM, fontSize:16, color:C.text, lineHeight:1.55, transition:"all 0.15s" }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = C.gold; e.currentTarget.style.background = C.goldPale; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.background = C.white; }}>
                    <span style={{ color:C.gold, marginRight:10, fontWeight:700 }}>{["A","B","C","D"][i]}.</span> {opt.text}
                  </button>
                ))}
              </div>
            </div>
          </section>
        ) : (
          <section style={{ padding:"64px 24px", textAlign:"center" }}>
            <div style={{ maxWidth:500, margin:"0 auto" }}>
              <h2 style={{ fontFamily:PF, fontSize:32, color:C.navy, margin:"0 0 20px" }}>All 18 questions complete.</h2>
              <Btn onClick={() => setStep("results")} style={{ fontSize:16, padding:"14px 40px" }}>See My Results</Btn>
            </div>
          </section>
        )}
      </div>
    );
  }

  if (step === "results") {
    const scores = computeScores();
    const sorted = DOMAINS.map(d => ({...d, score:scores[d.id]})).sort((a,b) => a.score - b.score);
    const primary = sorted[0];
    const secondary = sorted[1];
    return (
      <div style={{ paddingTop:64, background:C.cream, minHeight:"100vh" }}>
        <section style={{ background:C.navy, padding:"64px 24px 48px" }}>
          <div style={{ maxWidth:800, margin:"0 auto", textAlign:"center" }}>
            <div style={{ fontFamily:DM, fontSize:12, letterSpacing:3, color:C.gold, textTransform:"uppercase", marginBottom:12 }}>Your Results</div>
            <h1 style={{ fontFamily:PF, fontSize:40, color:C.white, margin:"0 0 12px" }}>Leadership Pressure Point Assessment</h1>
            <p style={{ fontFamily:DM, fontSize:17, color:"rgba(255,255,255,0.6)", marginBottom:4 }}>Primary pressure point: <strong style={{ color:C.gold }}>{primary.label}</strong></p>
            <p style={{ fontFamily:DM, fontSize:16, color:"rgba(255,255,255,0.4)" }}>Secondary: {secondary.label}</p>
          </div>
        </section>
        <section style={{ padding:"56px 24px" }}>
          <div style={{ maxWidth:800, margin:"0 auto" }}>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:16, marginBottom:40 }}>
              {sorted.map(d => (
                <div key={d.id} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:4, padding:24, borderLeft: d.id===primary.id ? `4px solid ${d.color}` : d.id===secondary.id ? `4px solid ${d.color}40` : `4px solid ${C.border}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                    <span style={{ fontFamily:PF, fontSize:17, color:C.navy, fontWeight:600 }}>{d.icon} {d.label}</span>
                    <ScoreBadge score={d.score} />
                  </div>
                  <div style={{ background:C.creamDark, borderRadius:2, height:8, marginBottom:6 }}>
                    <div style={{ width:`${d.score}%`, height:"100%", background:d.color, borderRadius:2, transition:"width 1s ease" }} />
                  </div>
                  <div style={{ fontFamily:DM, fontSize:13, color:C.muted }}>{d.score}/100</div>
                </div>
              ))}
            </div>
            {/* Domain insight cards — primary then secondary */}
            <div style={{ marginBottom:40 }}>
              <div style={{ fontFamily:DM, fontSize:11, letterSpacing:2, textTransform:"uppercase", color:C.muted, marginBottom:16 }}>Your Results In Depth</div>
              <DomainInsightCard domain={primary} score={primary.score} isPrimary={true} />
              <DomainInsightCard domain={secondary} score={secondary.score} isPrimary={false} />
            </div>

            <div style={{ background:C.navyMid, borderRadius:4, padding:36, textAlign:"center" }}>
              <EditableBlock text={content.assessment?.resultsCTA||"Get a personalized note from Julian."} onSave={v=>updateContent("assessment.resultsCTA",v)} fieldName="assessment.resultsCTA" tag="h3" style={{ fontFamily:PF, fontSize:24, color:C.white, margin:"0 0 12px" }} />
              <EditableBlock text={content.assessment?.resultsCTAbody||"Share your email and Julian will send you a personalized note based on your specific results — what the research says about your primary pressure point, and what it would actually take to address it. No automation. A real message from a real coach."} onSave={v=>updateContent("assessment.resultsCTAbody",v)} fieldName="assessment.resultsCTAbody" tag="p" style={{ fontFamily:DM, fontSize:16, color:"rgba(255,255,255,0.65)", margin:"0 0 24px", lineHeight:1.6 }} />
              {submitted ? (
                <div style={{ fontFamily:DM, fontSize:16, color:C.gold }}>✓ {savedMsg || "Results saved. Julian will be in touch."}</div>
              ) : (
                <div style={{ display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap" }}>
                  <input value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com"
                    style={{ padding:"12px 16px", fontFamily:DM, fontSize:16, border:`1px solid ${C.border}`, borderRadius:2, minWidth:240, background:C.cream }} />
                  <Btn onClick={async () => { setSubmitted(true); await saveResults(scores); }}>Send My Results</Btn>
                </div>
              )}
              <button onClick={async () => { await saveResults(scores); setSavedMsg("Saved locally ✓"); setSubmitted(true); }}
                style={{ background:"none", border:"none", fontFamily:DM, fontSize:14, color:"rgba(255,255,255,0.35)", cursor:"pointer", marginTop:12, textDecoration:"underline" }}>
                Save results without sharing email
              </button>
            </div>
          </div>
        </section>
      </div>
    );
  }
}

// BOOK PAGE
// ═══════════════════════════════════════════════════════
function BookPage() {

  return (
    <div style={{ paddingTop:64 }}>
      <section style={{ background:C.navy, padding:"80px 24px 64px" }}>
        <div style={{ maxWidth:900, margin:"0 auto", display:"grid", gridTemplateColumns:"1fr 1fr", gap:64, alignItems:"start" }}>
          <div>

// MAIN APP
// ═══════════════════════════════════════════════════════
function UnifiedSolutions() {
  // ── URL-aware routing ────────────────────────────────────────────
  const [page, setPage] = useState(() => {
    const map = {
      '/':'home', '/about':'about', '/coaching':'coaching',
      '/resources':'resources', '/assessment':'assessment', '/book':'book'
    };
    return map[window.location.pathname] || 'home';
  });
  const [content, setContent] = useState(DEFAULT_CONTENT);

  // ── Secure Admin Session ─────────────────────────────────────────
  // Entry: Ctrl+Shift+A (no visible UI in public nav)
  // Auth:  SHA-256 hashed PIN comparison, lockout after 5 fails
  // Session: sessionStorage (auto-clears on browser close), 1hr timeout
  const [adminSession, setAdminSession] = useState(() => {
    try {
      const s = JSON.parse(sessionStorage.getItem('us-admin-session') || 'null');
      return s && s.expires > Date.now() ? s : null;
    } catch(e) { return null; }
  });
  const [editMode, setEditMode] = useState(false);
  const [showAdminModal, setShowAdminModal] = useState(false);

  const isAdmin = adminSession && adminSession.expires > Date.now();

  // ── Secret keyboard shortcut ─────────────────────────────────────
  useEffect(() => {
    const onKey = (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'A') {
        e.preventDefault();
        if (isAdmin) { setEditMode(m => !m); }
        else { setShowAdminModal(true); }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [isAdmin]);

  function handleAdminLogin(pin) {
    return crypto.subtle.digest('SHA-256',
      new TextEncoder().encode('unified_solutions_2026' + pin)
    ).then(buf => {
      const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
      const ADMIN_HASH = '2fbfec39f6fd0c978b6dc9b0a1beeadc5b2c1da49d20f514e7ab8cf1004ac3d2';
      if (hash === ADMIN_HASH) {
        const session = { loggedIn: true, expires: Date.now() + 3600000, loginTime: new Date().toISOString() };
        sessionStorage.setItem('us-admin-session', JSON.stringify(session));
        setAdminSession(session);
        setShowAdminModal(false);
        return true;
      }
      return false;
    });
  }

  function handleAdminLogout() {
    sessionStorage.removeItem('us-admin-session');
    setAdminSession(null);
    setEditMode(false);
  }

  // Inject Google Fonts
  useEffect(() => {
    const s = document.createElement("style");
    s.textContent = `@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');`;
    document.head.appendChild(s);
    return () => document.head.removeChild(s);
  }, []);

  // Load saved content
  useEffect(() => {
    (async () => {
      try {
        const r = await storage.get("cms-content");
        if (r) setContent(JSON.parse(r.value));
      } catch (e) {}
    })();
  }, []);

  // ── Sync URL when page changes (pushState) ──────────────
  useEffect(() => {
    const urls = {
      home:'/', about:'/about', coaching:'/coaching',
      resources:'/resources', assessment:'/assessment', book:'/book'
    };
    const newUrl = urls[page] || '/';
    if (window.location.pathname !== newUrl) {
      window.history.pushState({ page }, document.title, newUrl);
    }
    window.scrollTo(0, 0);
  }, [page]);

  // ── Handle browser back / forward buttons ────────────
  useEffect(() => {
    const pageMap = {
      '/':'home', '/about':'about', '/coaching':'coaching',
      '/resources':'resources', '/assessment':'assessment', '/book':'book'
    };
    const onPop = () => setPage(pageMap[window.location.pathname] || 'home');
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  function updateContent(path, value) {
    setContent(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const keys = path.split(".");
      let obj = next;
      for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
      obj[keys[keys.length-1]] = value;
      return next;
    });
  }

  async function saveContent() {
    try {
      await storage.set("cms-content", JSON.stringify(content));
      setEditMode(false);
    } catch (e) { alert("Storage unavailable — changes not saved."); }
  }

  const ctx = { page, setPage, editMode, setEditMode, content, updateContent, saveContent, isAdmin, handleAdminLogin, handleAdminLogout, showAdminModal, setShowAdminModal };

  return (
    <Ctx.Provider value={ctx}>
      <div style={{ fontFamily: DM, background:C.cream, color:C.text, minHeight:"100vh" }}>
        {showAdminModal && <AdminLoginModal />}
        {isAdmin && <AdminToolbar />}
        <Nav />
        <main style={{ paddingTop: editMode ? 0 : 0 }}>
          {page === "home"       && <HomePage />}
          {page === "about"      && <AboutPage />}
          {page === "coaching"   && <CoachingPage />}
          {page === "resources"  && <ResourcesPage />}
          {page === "assessment" && <AssessmentPage />}
          {page === "book"       && <BookPage />}
        </main>
        <Footer />
      </div>
    </Ctx.Provider>
  );
}

  </script>
