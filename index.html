// ─── SESSION GENERATOR ─────────────────────────────────────────────────────
// Builds a fresh, randomized 18-question set each time the assessment starts:
// • Randomly selects 3 of 5 questions per domain
// • Randomizes domain order (so identity isn't always first)
// • Shuffles answer options (so best answer isn't always position A)
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateAssessmentSession() {
  const allQuestions = [...QUESTIONS, ...QUESTION_POOL_EXTRA];
  const domainOrder = shuffleArray([...DOMAINS.map(d => d.id)]);
  const session = [];
  let qNum = 1;
  domainOrder.forEach(domainId => {
    const pool = allQuestions.filter(q => q.domain === domainId);
    const selected = shuffleArray(pool).slice(0, 3);
    selected.forEach(q => {
      session.push({
        ...q,
        sessionId: qNum++,
        options: shuffleArray([...q.options]) // shuffle so A isn't always best
      });
    });
  });
  return session;
}

function Btn({ children, variant="gold", onClick, href, style={} }) {
  const base = { fontFamily:DM, fontWeight:600, fontSize:16, letterSpacing:1, textTransform:"uppercase", padding:"12px 28px", borderRadius:2, cursor:"pointer", border:"none", transition:"all 0.2s", display:"inline-block", textDecoration:"none" };
  const variants = {
    gold:  { background:C.gold, color:C.white, ...base },
    ghost: { background:"transparent", color:C.gold, border:`1px solid ${C.gold}`, ...base },
    navy:  { background:C.navy, color:C.white, ...base },
    white: { background:"transparent", color:C.white, border:`1px solid rgba(255,255,255,0.5)`, ...base },
  };
  const s = { ...variants[variant], ...style };
  if (href) return <a href={href} target="_blank" rel="noopener noreferrer" style={s}>{children}</a>;
  return <button style={s} onClick={onClick}>{children}</button>;
}

function Divider({ color = C.border }) {
  return <div style={{ height:1, background:color, width:"100%", margin:"0" }} />;
}

function EditableBlock({ text, onSave, tag:Tag="p", style={}, fieldName="content" }) {
  const { editMode, isAdmin } = useSite();
  const ref = useRef(null);
  if (!editMode || !isAdmin) return <Tag style={style}>{text}</Tag>;

  function handleSave(newText) {
    if (newText === text) return;
    // Log the change
    try {
      const log = JSON.parse(localStorage.getItem('cms-change-log') || '[]');
      log.push({ timestamp: new Date().toISOString(), field: fieldName, oldValue: text, newValue: newText });
      if (log.length > 500) log.splice(0, log.length - 500); // cap at 500 entries
      localStorage.setItem('cms-change-log', JSON.stringify(log));
    } catch(e) {}
    onSave(newText);
  }

  return (
    <Tag
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      style={{ ...style, outline:`2px dashed ${C.gold}`, outlineOffset:2, minHeight:"1em", cursor:"text" }}
      onBlur={e => handleSave(e.currentTarget.innerText)}
    >
      {text}
    </Tag>
  );
}

function ScoreBadge({ score }) {
  const color = score >= 75 ? C.green : score >= 50 ? C.gold : C.red;
  const label = score >= 75 ? "Strong" : score >= 50 ? "Developing" : "Priority Area";
  return <span style={{ background:`${color}18`, color, border:`1px solid ${color}40`, fontSize:12, fontWeight:700, padding:"2px 8px", borderRadius:10, letterSpacing:1, fontFamily:DM }}>{label}</span>;
}

        {view === "themes" && (

              <div key={i} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:3, padding:"12px 14px", display:"flex", gap:10, alignItems:"flex-start" }}>
                <span style={{ color:C.gold, fontSize:16, flexShrink:0, marginTop:1 }}>{t.icon}</span>

}

// ADMIN LOGIN MODAL (secret entry: Ctrl+Shift+A)

// ═══════════════════════════════════════════════════════════════════
// PIN CHANGER — used in AdminToolbar modal
// ═══════════════════════════════════════════════════════════════════
function PinChanger({ onDone }) {
  const [current, setCurrent] = useState('');
  const [next,    setNext]    = useState('');
  const [confirm, setConfirm] = useState('');
  const [status,  setStatus]  = useState(null);
  const [message, setMessage] = useState('');
  const [savedHash, setSavedHash] = useState('');
  const [usingCustom, setUsingCustom] = useState(false);
  const FALLBACK = '2fbfec39f6fd0c978b6dc9b0a1beeadc5b2c1da49d20f514e7ab8cf1004ac3d2';

  useEffect(() => {
    (async () => {
      try { const r = await storage.get('admin-pin-hash'); setUsingCustom(!!(r&&r.value)); } catch(e) {}
    })();
  }, []);

  async function hash(pin) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('unified_solutions_2026'+pin));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  const checks = { length:next.length>=12, upper:/[A-Z]/.test(next), lower:/[a-z]/.test(next), number:/[0-9]/.test(next), symbol:/[^A-Za-z0-9]/.test(next), match:!!(next&&next===confirm) };
  const strength = Object.values(checks).filter(Boolean).length;
  const sColor = [T=>T,T=>C.red,T=>C.red,T=>C.orange,T=>C.yellow,T=>C.green,T=>C.green][strength]({});
  const canSubmit = Object.values(checks).every(Boolean) && current.length > 0;

  async function handleChange() {
    if (!canSubmit) return;
    setStatus('loading');
    const curHash = await hash(current);
    let active = FALLBACK;
    try { const r = await storage.get('admin-pin-hash'); if (r&&r.value) active=r.value; } catch(e){}
    if (curHash !== active) { setStatus('error'); setMessage('Current PIN is incorrect.'); setCurrent(''); return; }
    const newHash = await hash(next);
    try {
      await storage.set('admin-pin-hash', newHash);
      setSavedHash(newHash); setStatus('success'); setUsingCustom(true);
      setMessage('PIN updated. Active immediately — no redeployment needed.');
      setCurrent(''); setNext(''); setConfirm('');
    } catch(e) { setStatus('error'); setMessage('Storage error. Try again.'); }
  }

  const inp = { width:"100%", padding:"10px 14px", fontFamily:DM, fontSize:14, background:"#050A0F", border:"1px solid rgba(255,255,255,0.15)", borderRadius:4, color:C.white, letterSpacing:3, outline:"none", boxSizing:"border-box" };
  const lbl = { fontFamily:DM, fontSize:11, letterSpacing:2, textTransform:"uppercase", color:"rgba(255,255,255,0.5)", display:"block", marginBottom:6 };

  return (
    <div style={{ maxWidth:460 }}>
      <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:6, padding:"10px 16px", marginBottom:20, display:"flex", gap:10, alignItems:"center" }}>
        <span style={{ fontSize:16 }}>{usingCustom?"🔐":"⚠️"}</span>
        <div style={{ fontFamily:DM, fontSize:12, color:usingCustom?C.green:C.orange }}>{usingCustom?"Custom PIN active — storage-based":"Default PIN in use — change recommended"}</div>
      </div>
      {status==="success" ? (
        <div>
          <div style={{ background:"#0D1F0D", border:`1px solid ${C.green}40`, borderRadius:6, padding:"16px 18px", marginBottom:12 }}>
            <div style={{ fontFamily:DM, fontSize:13, fontWeight:700, color:C.green, marginBottom:6 }}>✓ {message}</div>
          </div>
          {savedHash && <div style={{ background:"#050A0F", border:"1px solid rgba(255,255,255,0.1)", borderRadius:4, padding:"10px 14px", marginBottom:12 }}>
            <div style={{ fontFamily:DM, fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"rgba(255,255,255,0.35)", marginBottom:4 }}>Backup hash (save offline)</div>
            <div style={{ fontFamily:"monospace", fontSize:10, color:"rgba(255,255,255,0.5)", wordBreak:"break-all" }}>{savedHash}</div>
          </div>}
          <div style={{ display:"flex", gap:8 }}>
            {onDone && <button onClick={onDone} style={{ background:C.gold, border:"none", borderRadius:4, padding:"8px 20px", fontFamily:DM, fontWeight:700, fontSize:13, color:C.white, cursor:"pointer" }}>Done</button>}
            <button onClick={()=>setStatus(null)} style={{ background:"none", border:`1px solid ${C.border}`, borderRadius:4, padding:"8px 14px", fontFamily:DM, fontSize:12, color:C.muted, cursor:"pointer" }}>Change again</button>
          </div>
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div><label style={lbl}>Current PIN</label><input type="password" value={current} onChange={e=>{setCurrent(e.target.value);setStatus(null);setMessage('');}} placeholder="Current PIN" style={inp} autoComplete="current-password"/></div>
          <div>
            <label style={lbl}>New PIN</label>
            <input type="password" value={next} onChange={e=>{setNext(e.target.value);setStatus(null);}} placeholder="12+ characters" style={inp} autoComplete="new-password"/>
            {next && <div style={{ marginTop:8 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                <div style={{ flex:1, background:"rgba(255,255,255,0.08)", borderRadius:2, height:4 }}><div style={{ width:`${(strength/6)*100}%`, height:"100%", background:sColor, borderRadius:2, transition:"width 0.2s" }}/></div>
                <span style={{ fontFamily:DM, fontSize:11, color:sColor, minWidth:50 }}>{["","Weak","Weak","Fair","Good","Strong","Strong"][strength]}</span>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:3 }}>
                {[[checks.length,"12+ characters"],[checks.upper,"Uppercase"],[checks.lower,"Lowercase"],[checks.number,"Number"],[checks.symbol,"Symbol"],[checks.match,"Passwords match"]].map(([ok,l],i)=>(
                  <div key={i} style={{ display:"flex", gap:5, alignItems:"center" }}>
                    <span style={{ fontSize:11, color:ok?C.green:"rgba(255,255,255,0.2)" }}>{ok?"✓":"○"}</span>
                    <span style={{ fontFamily:DM, fontSize:11, color:ok?"rgba(255,255,255,0.7)":"rgba(255,255,255,0.3)" }}>{l}</span>
                  </div>
                ))}
              </div>
            </div>}
          </div>
          <div><label style={lbl}>Confirm New PIN</label><input type="password" value={confirm} onChange={e=>{setConfirm(e.target.value);setStatus(null);}} placeholder="Repeat new PIN" style={{ ...inp, borderColor:confirm&&!checks.match?"#E07070":"rgba(255,255,255,0.15)" }} autoComplete="new-password"/></div>
          {status==="error" && <div style={{ background:"rgba(224,82,82,0.12)", border:"1px solid rgba(224,82,82,0.3)", borderRadius:4, padding:"10px 14px", fontFamily:DM, fontSize:13, color:"#E07070" }}>{message}</div>}
          <button onClick={handleChange} disabled={!canSubmit||status==="loading"} style={{ background:canSubmit?C.gold:"rgba(255,255,255,0.06)", color:canSubmit?C.white:"rgba(255,255,255,0.2)", border:"none", borderRadius:4, padding:"12px 24px", fontFamily:DM, fontWeight:700, fontSize:14, cursor:canSubmit?"pointer":"not-allowed" }}>
            {status==="loading"?"Updating...":"Update Admin PIN"}
          </button>
        </div>
      )}
    </div>
  );
}

// CONTENT PIPELINE PANEL — topic library with Notion push
// ═══════════════════════════════════════════════════════════════════
function ContentPipelinePanel({ apiKey, notionToken }) {
  const [nStatus, setNStatus] = useState({});
  const [pillar,  setPillar]  = useState("all");
  const [status,  setStatus]  = useState("all");
  const [pushing, setPushing] = useState(null);
  const [diagLog, setDiagLog] = useState("");
  const [showDiag, setShowDiag] = useState(false);

  const visible = ARTICLES.filter(a =>
    (pillar === "all" || a.pillar === pillar) &&
    (status === "all" || a.status === status)
  );

  // ── Extract any Notion URL from text ────────────────────────────
  function extractNotionUrl(text) {
    // Match notion.so URLs with or without www, with any path
    const m = text.match(/https?:\/\/(?:www\.)?notion\.so\/[^\s"'\]<>]+/);
    return m ? m[0].replace(/[.,;)]+$/, "") : "";
  }

  // ── Parse ALL blocks including tool results ──────────────────────
  function parseBlocks(blocks) {
    let text = "";
    let url  = "";
    for (const b of (blocks || [])) {
      let chunk = "";
      if (b.type === "text") {
        chunk = b.text || "";
      } else if (b.type === "mcp_tool_result") {
        chunk = (b.content || []).map(c => c.text || "").join("\n");
      } else if (b.type === "mcp_tool_use") {
        // Tool call input — useful for debugging
        try { chunk = "TOOL CALL: " + b.name + " " + JSON.stringify(b.input).slice(0, 200); } catch(e) {}
      }
      text += chunk + "\n";
      if (!url) url = extractNotionUrl(chunk);
    }
    return { text: text.trim(), url };
  }

  async function pushOne(a) {
    if (!apiKey) { alert("Add your Anthropic API key in the Security tab."); return; }
    if (!notionToken) {
      alert("Add your Notion token above.\n\nHow to get one:\n1. Go to notion.so/profile/integrations\n2. Create a new integration → copy the secret_ token\n3. In Notion, open any top-level page → '...' menu → Connections → connect your integration\n4. Paste the token in the field above");
      return;
    }
    setPushing(a.id);
    setNStatus(p => ({...p, [a.id]: "pushing"}));
    setDiagLog("");

    try {
      const pillarObj = CONTENT_PILLARS.find(x => x.id === a.pillar);
      const auds = (a.audience || [])
        .map(id => CONTENT_AUDIENCES.find(x => x.id === id)?.label)
        .filter(Boolean).join(", ");

      // ── Structured prompt — tells Claude exactly what to do and how to report back ──
      const prompt =
`You are helping manage a Notion content library for Unified Solutions Inc.

Follow these steps in order:

STEP 1 — SEARCH: Use the Notion search tool to look for a database named "Content Library — Unified Solutions". Search for it now.

STEP 2 — IF FOUND: Note the database ID and skip to STEP 4.

STEP 3 — IF NOT FOUND: Create a new full-page database at the top level of the workspace. Name it exactly: Content Library — Unified Solutions
Give it these properties:
- Title (type: title)
- Status (type: select, options: Idea, Outline, Draft, Published)
- Pillar (type: select)
- Audience (type: multi_select)
- Tag (type: rich_text)
- Read Time (type: rich_text)
- Summary (type: rich_text)
- URL (type: url)

STEP 4 — ADD PAGE: Create a new page in the database with these exact values:
Title: ${a.title}
Status: ${a.status === "published" ? "Published" : "Idea"}
Pillar: ${pillarObj?.label || a.pillar}
Audience: ${auds}
Tag: ${a.tag || ""}
Read Time: ${a.mins} min
Summary: ${a.summary}
URL: ${a.url || ""}

STEP 5 — REPORT: After completing the above, output these two lines exactly:
DATABASE_URL: <full notion.so URL of the database>
PAGE_URL: <full notion.so URL of the new page>

Do not add any other text after the URL lines.`;

      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type":                              "application/json",
          "x-api-key":                                 apiKey,
          "anthropic-version":                         "2023-06-01",
          "anthropic-beta":                            "mcp-client-2025-04-04",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model:      "claude-sonnet-4-6",
          max_tokens: 1500,
          mcp_servers: [{
            type:                "url",
            url:                 "https://mcp.notion.com/mcp",
            name:                "notion",
            authorization_token: notionToken
          }],
          messages: [{ role: "user", content: prompt }]
        })
      });

      const data = await res.json();

      if (data.error) {
        const msg = data.error.message || "API error";
        setNStatus(p => ({...p, [a.id]: "error:" + msg}));
        setDiagLog("API ERROR: " + msg);
        setPushing(null);
        return;
      }

      const { text: fullText, url: extractedUrl } = parseBlocks(data.content);
      setDiagLog(fullText);

      // ── Look for structured URL lines first ──────────────────────
      let dbUrl   = "";
      let pageUrl = extractedUrl;

      const dbLine   = fullText.match(/DATABASE_URL:\s*(https?:\/\/[^\s\n]+)/);
      const pageLine = fullText.match(/PAGE_URL:\s*(https?:\/\/[^\s\n]+)/);
      if (dbLine)   dbUrl   = dbLine[1].replace(/[.,;)]+$/, "");
      if (pageLine) pageUrl = pageLine[1].replace(/[.,;)]+$/, "");

      // ── Fallback: any notion URL in the response ─────────────────
      if (!pageUrl) pageUrl = extractedUrl;
      if (!dbUrl)   dbUrl   = extractedUrl;

      const lower = fullText.toLowerCase();
      const isError = (lower.includes("unauthorized") || lower.includes("invalid_token") ||
                       lower.includes("api_token_invalid") || lower.includes("forbidden")) &&
                       !pageUrl && !dbUrl;

      if (isError) {
        const errLine = fullText.split("\n").find(l =>
          l.toLowerCase().match(/error|unauthorized|invalid|forbidden/)
        ) || fullText.slice(0, 150);
        setNStatus(p => ({...p, [a.id]: "error:" + errLine.trim()}));
      } else {
        // Success — store both database and page URLs
        setNStatus(p => ({...p, [a.id]: "done:" + (pageUrl || dbUrl || "created")}));
      }

    } catch(e) {
      setNStatus(p => ({...p, [a.id]: "error:" + e.message}));
      setDiagLog("Exception: " + e.message);
    }
    setPushing(null);
  }

  async function pushAll() {
    const todo = visible.filter(a => {
      const s = nStatus[a.id] || "idle";
      return s === "idle" || s.startsWith("error");
    });
    for (const a of todo) { await pushOne(a); }
  }

  // ── Find database — diagnostic, full error surfacing ────────────
  async function findDatabase() {
    if (!apiKey || !notionToken) { alert("Add your API key and Notion token first."); return; }
    setShowDiag(true);
    setDiagLog("Connecting to Notion...");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type":                              "application/json",
          "x-api-key":                                 apiKey,
          "anthropic-version":                         "2023-06-01",
          "anthropic-beta":                            "mcp-client-2025-04-04",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          mcp_servers: [{ type:"url", url:"https://mcp.notion.com/mcp", name:"notion", authorization_token: notionToken }],
          messages: [{ role:"user", content:"Using your Notion tools, list the first 10 pages and databases you have access to. For each one show its title and URL. If you cannot access Notion, explain exactly why." }]
        })
      });
      const data = await res.json();
      const lines = [`HTTP ${res.status} ${res.statusText}`];
      if (data.error) {
        lines.push(`API ERROR [${data.error.type}]: ${data.error.message}`);
        if (data.error.type === "authentication_error") lines.push("Your Anthropic API key is invalid or expired.");
      } else {
        lines.push(`Stop reason: ${data.stop_reason || "unknown"}`);
        lines.push(`Blocks: ${(data.content || []).length}`);
        lines.push("");
        for (const b of (data.content || [])) {
          if (b.type === "text") {
            lines.push(`[TEXT]`); lines.push(b.text);
          } else if (b.type === "tool_use") {
            lines.push(`[TOOL CALL] ${b.name}`); lines.push(JSON.stringify(b.input, null, 2).slice(0, 300));
          } else if (b.type === "tool_result") {
            const c = (b.content || []).map(x => x.text || "").join(" | ");
            lines.push(`[TOOL RESULT]`); lines.push(c.slice(0, 500));
          } else if (b.type === "mcp_tool_use") {
            lines.push(`[MCP CALL] ${b.name}`); lines.push(JSON.stringify(b.input || {}, null, 2).slice(0, 300));
          } else if (b.type === "mcp_tool_result") {
            const c = (b.content || []).map(x => x.text || "").join(" | ");
            lines.push(`[MCP RESULT]`); lines.push(c.slice(0, 500));
          } else {
            lines.push(`[${b.type}] (unhandled)`);
          }
          lines.push("");
        }
        if ((data.content || []).length === 0) {
          lines.push("No content blocks returned.");
          lines.push("Likely cause: Notion MCP server rejected the token.");
          lines.push("Fix: In Notion, share a top-level page with your integration via the '...' menu → Connections.");
        }
      }
      setDiagLog(lines.join("\n").trim());
    } catch(e) {
      setDiagLog(`Exception: ${e.message}`);
    }
  }

  // ── CSV export — downloads all articles for Notion import ──────
  function exportCSV() {
    const headers = ["Title","Status","Pillar","Audience","Tag","Read Time","Summary","URL"];
    const rows = ARTICLES.map(a => {
      const pillar = CONTENT_PILLARS.find(x => x.id === a.pillar);
      const auds   = (a.audience || []).map(id => CONTENT_AUDIENCES.find(x => x.id === id)?.label).filter(Boolean).join("; ");
      const esc    = v => '"' + String(v || "").replace(/"/g, '""') + '"';
      return [
        esc(a.title),
        esc(a.status === "published" ? "Published" : "Idea"),
        esc(pillar?.label || a.pillar),
        esc(auds),
        esc(a.tag),
        esc((a.mins || "") + " min"),
        esc(a.summary),
        esc(a.url || ""),
      ].join(",");
    });
    const csv  = [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = "usi-content-library.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  const pillBtnStyle = (active, color) => ({
    background: active ? color + "18" : "transparent",
    color: active ? color : C.muted,
    border: `1px solid ${active ? color + "60" : C.border}`,
    borderRadius: 4, padding: "4px 10px",
    fontFamily: DM, fontSize: 11, fontWeight: active ? 700 : 400,
    cursor: "pointer", whiteSpace: "nowrap", transition: "all 0.15s"
  });

  return (
    <div>
      {/* Filter + actions */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
          <button onClick={() => setPillar("all")} style={pillBtnStyle(pillar === "all", C.navy)}>All Pillars</button>
          {CONTENT_PILLARS.map(p => (
            <button key={p.id} onClick={() => setPillar(p.id)} style={pillBtnStyle(pillar === p.id, p.color)}>
              {p.icon} {p.label.split(" ")[0]}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
          {[["all","All"],["published","Published"],["planned","Planned"]].map(([v,l]) => (
            <button key={v} onClick={() => setStatus(v)} style={pillBtnStyle(status === v, C.navy)}>
              {l} ({ARTICLES.filter(a => v === "all" || a.status === v).length})
            </button>
          ))}
          <button onClick={exportCSV} style={{
            marginLeft: "auto", background: C.green, color: C.white,
            border: "none", borderRadius: 4, padding: "5px 14px",
            fontFamily: DM, fontWeight: 700, fontSize: 12, cursor: "pointer"
          }}>
            ⬇ Download for Notion
          </button>
          <button onClick={pushAll} disabled={pushing !== null} style={{
            background: pushing ? C.border : C.gold,
            color: C.white, border: "none", borderRadius: 4, padding: "5px 14px",
            fontFamily: DM, fontWeight: 700, fontSize: 12,
            cursor: pushing ? "not-allowed" : "pointer"
          }}>
            {pushing ? "Pushing…" : "⬆ Push All → Notion"}
          </button>

              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: DM, fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{a.title}</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: DM, fontSize: 11, color: p?.color || C.gold, fontWeight: 600 }}>{p?.label}</span>
                  <span style={{ fontFamily: DM, fontSize: 11, color: C.muted }}>· {a.tag} · {a.mins} min</span>
                </div>
                {isErr && errMsg && (
                  <div style={{ fontFamily: DM, fontSize: 10, color: C.red, marginTop: 3, lineHeight: 1.5 }}>{errMsg.slice(0, 120)}</div>

              </div>
              <span style={{ fontFamily: DM, fontSize: 10, fontWeight: 700, letterSpacing: 0.8, textTransform: "uppercase", color: a.status === "published" ? C.green : C.orange, background: a.status === "published" ? C.green + "14" : C.orange + "14", border: `1px solid ${a.status === "published" ? C.green + "40" : C.orange + "40"}`, borderRadius: 8, padding: "2px 8px", flexShrink: 0 }}>
                {a.status === "published" ? "Live" : "Planned"}
              </span>
              <div style={{ flexShrink: 0, display: "flex", alignItems: "center", gap: 6 }}>
                {ns === "pushing" ? (
                  <span style={{ fontFamily: DM, fontSize: 12, color: C.gold }}>Pushing…</span>
                ) : isDone ? (
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <span style={{ fontFamily: DM, fontSize: 12, color: C.green, fontWeight: 600 }}>✓ In Notion</span>
                    {pageUrl && pageUrl !== "created" && (
                      <a href={pageUrl} target="_blank" rel="noopener noreferrer"
                        style={{ fontFamily: DM, fontSize: 11, color: C.gold, textDecoration: "none", border: `1px solid ${C.gold}40`, borderRadius: 3, padding: "2px 7px" }}>
                        Open →
                      </a>
                    )}
                  </div>
                ) : isErr ? (
                  <button onClick={() => pushOne(a)} disabled={pushing !== null}
                    style={{ background: "none", border: `1px solid ${C.red}`, borderRadius: 3, padding: "3px 9px", fontFamily: DM, fontSize: 11, color: C.red, cursor: "pointer" }}>
                    Retry
                  </button>
                ) : (
                  <button onClick={() => pushOne(a)} disabled={pushing !== null} style={{
                    background: "none", border: `1px solid ${C.gold}80`, borderRadius: 4,
                    padding: "4px 12px", fontFamily: DM, fontSize: 12, fontWeight: 600, color: C.gold,
                    cursor: pushing ? "not-allowed" : "pointer", opacity: pushing ? 0.5 : 1
                  }}>
                    ⬆ Notion
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ARTICLE ANALYTICS PANEL
// Shows per-article click counts stored in localStorage
// Visible in Admin → Dashboard → scroll down
// ═══════════════════════════════════════════════════════════════
function ArticleAnalyticsPanel() {
  const [counts, setCounts] = useState({});
  const [sortBy, setSortBy] = useState("clicks");

  useEffect(() => {
    function load() {
      try {
        const raw = localStorage.getItem("usi-article-clicks");
        if (raw) setCounts(JSON.parse(raw));
      } catch(e) {}
    }
    load();
    const t = setInterval(load, 15000);
    return () => clearInterval(t);
  }, []);

  const published = ARTICLES.filter(a => a.status === "published");
  const withCounts = published.map(a => ({ ...a, clicks: counts[a.id] || 0 }));
  const sorted = [...withCounts].sort((a,b) => sortBy === "clicks" ? b.clicks - a.clicks : a.id - b.id);
  const total = Object.values(counts).reduce((s,n) => s+n, 0);
  const max = Math.max(...sorted.map(a => a.clicks), 1);
  const top = sorted[0];

  return (
    <div>
      {/* Summary row */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginBottom:18 }}>
        {[
          [total, "Total Clicks", C.gold],
          [sorted.filter(a=>a.clicks>0).length, "Articles Clicked", C.navy],
          [top?.clicks||0, "Top Article", C.green],
          [sorted.filter(a=>a.clicks===0).length, "Not Yet Clicked", C.muted],
        ].map(([v,l,c],i) => (
          <div key={i} style={{ background:C.creamDark, border:`1px solid ${C.border}`, borderRadius:6, padding:"12px 14px" }}>
            <div style={{ fontFamily:PF, fontSize:22, color:c, fontWeight:700 }}>{v}</div>
            <div style={{ fontFamily:DM, fontSize:10, letterSpacing:1, textTransform:"uppercase", color:C.muted, marginTop:3 }}>{l}</div>
          </div>
        ))}
      </div>

      {/* Top article highlight */}
      {top && top.clicks > 0 && (
        <div style={{ background:`${C.gold}12`, border:`1px solid ${C.gold}40`, borderRadius:6, padding:"12px 16px", marginBottom:14, display:"flex", gap:12, alignItems:"center" }}>
          <span style={{ fontSize:18 }}>★</span>
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:DM, fontSize:10, color:C.gold, fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:2 }}>Most Clicked</div>
            <div style={{ fontFamily:PF, fontSize:14, color:C.navy, fontWeight:600 }}>{top.title}</div>
          </div>
          <div style={{ textAlign:"right", flexShrink:0 }}>
            <div style={{ fontFamily:PF, fontSize:22, color:C.gold, fontWeight:700 }}>{top.clicks}</div>
            <div style={{ fontFamily:DM, fontSize:10, color:C.muted }}>clicks</div>
          </div>
        </div>
      )}

      {/* Sort controls */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
        <div style={{ fontFamily:DM, fontSize:12, fontWeight:600, color:C.navy }}>
          All Published Articles ({sorted.length})
        </div>
        <div style={{ display:"flex", gap:4 }}>
          {[["clicks","By Clicks"],["id","By Number"]].map(([v,l]) => (
            <button key={v} onClick={() => setSortBy(v)} style={{ background:sortBy===v?C.navy:"transparent", color:sortBy===v?C.white:C.muted, border:`1px solid ${sortBy===v?C.navy:C.border}`, borderRadius:4, padding:"3px 10px", fontFamily:DM, fontSize:11, cursor:"pointer" }}>{l}</button>
          ))}
        </div>
      </div>

      {/* Article bars */}
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        {sorted.map(a => (
          <div key={a.id} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:6, padding:"10px 14px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, marginBottom:5 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:DM, fontSize:12, fontWeight:600, color:C.navy, lineHeight:1.3 }}>{a.title}</div>
                {a.tag && <div style={{ fontFamily:DM, fontSize:10, color:C.muted, marginTop:2 }}>{a.tag} · {a.mins} min</div>}
              </div>
              <div style={{ textAlign:"right", flexShrink:0 }}>
                <span style={{ fontFamily:PF, fontSize:20, color:a.clicks>0?C.navy:C.muted, fontWeight:700 }}>{a.clicks}</span>
                <span style={{ fontFamily:DM, fontSize:10, color:C.muted, display:"block" }}>{a.clicks===1?"click":"clicks"}</span>
              </div>
            </div>
            <div style={{ background:C.creamDark, borderRadius:3, height:5 }}>
              <div style={{ width:`${(a.clicks/max)*100}%`, height:"100%", background:a.clicks>0?C.gold:C.border, borderRadius:3, transition:"width 0.4s" }}/>
            </div>
            {a.url && <a href={a.url} target="_blank" rel="noopener noreferrer" style={{ fontFamily:DM, fontSize:10, color:C.goldDark, display:"inline-block", marginTop:4 }}>View article →</a>}
          </div>
        ))}
      </div>

      {/* Note */}
      <div style={{ marginTop:14, background:C.navyMid, borderRadius:6, padding:"10px 14px" }}>
        <div style={{ fontFamily:DM, fontSize:11, color:C.gold, fontWeight:700, marginBottom:3 }}>About these counts</div>
        <div style={{ fontFamily:DM, fontSize:11, color:"rgba(255,255,255,0.55)", lineHeight:1.6 }}>
          Counts are stored in this browser only. For cross-visitor totals, add Google Analytics 4 — the tracking calls are already wired in. Contact your developer or follow the GA4 setup guide in the code comments.
        </div>
      </div>
    </div>
  );
}


function AdminPanel({ onClose, initialTab="crm" }) {
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [apiKey, setApiKey]       = useState(() => (localStorage.getItem("us-api-key")||"").trim());
  const [notionToken, setNotionToken] = useState(() => (localStorage.getItem("us-notion-token")||"").trim());
  const [selected, setSelected]     = useState(null);
  const [notionStatus, setNotionStatus] = useState({});
  const [adminTab, setAdminTab]     = useState(initialTab);

  useEffect(() => { loadRecords(); }, []);

  async function loadRecords() {
    setLoading(true);
    try { const r = await storage.get("assessment-results"); if (r) setRecords(JSON.parse(r.value)); } catch(e) {}
    setLoading(false);
  }

  async function syncToNotion(record, idx) {
    if (!apiKey) { alert("Add your Anthropic API key below first."); return; }
    setNotionStatus(p=>({...p,[idx]:"syncing"}));
    try {
      const sorted = Object.entries(record.scores||{}).sort((a,b)=>a[1]-b[1]);
      const primary = DOMAINS.find(d=>d.id===sorted[0]?.[0]);
      const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:800,mcp_servers:[{type:"url",url:"https://mcp.notion.com/mcp",name:"notion"}],messages:[{role:"user",content:`Create a page in "Coaching Contacts — Unified Solutions CRM": Name: "${record.email||"Anonymous"}". Email: "${record.email||""}". Date: "${record.timestamp}". Primary Pressure Point: "${primary?.label||""}". Identity: ${record.scores?.identity||0}. Decision: ${record.scores?.decision||0}. Relational: ${record.scores?.relational||0}. Team: ${record.scores?.team||0}. Sustainability: ${record.scores?.sustainability||0}. Strategic: ${record.scores?.strategic||0}. Status: "New Lead". Confirm done.`}]})});
      const d = await res.json();
      const txt = (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").toLowerCase();
      setNotionStatus(p=>({...p,[idx]:txt.includes("error")?"error":"synced"}));
    } catch(e) { setNotionStatus(p=>({...p,[idx]:"error"})); }
  }

  async function clearAll() {
    if (window.confirm("Delete all locally stored assessment records?")) { await storage.set("assessment-results",JSON.stringify([])); setRecords([]); }
  }

  const TABS = [["crm","📊 CRM"],["content","📝 Content"],["security","🔐 Security"]];
  const tc = { fontFamily:DM, fontSize:10, padding:"12px 18px", border:"none", background:"none", cursor:"pointer", transition:"all 0.2s" };
  const th = { fontFamily:DM, fontSize:11, letterSpacing:2, textTransform:"uppercase", color:C.muted, padding:"10px 12px", borderBottom:`2px solid ${C.border}`, textAlign:"left" };
  const td = { fontFamily:DM, fontSize:13, padding:"11px 12px", borderBottom:`1px solid ${C.border}` };

  return (
    <div style={{ position:"fixed", inset:0, zIndex:800, background:"rgba(0,0,0,0.75)", display:"flex", alignItems:"flex-start", justifyContent:"center", overflowY:"auto", paddingTop:20 }}>
      <div style={{ background:C.cream, borderRadius:8, width:"95%", maxWidth:1000, maxHeight:"92vh", overflowY:"auto", boxShadow:"0 32px 80px rgba(0,0,0,0.5)" }}>
        {/* Header */}
        <div style={{ background:C.navy, padding:"18px 28px", display:"flex", justifyContent:"space-between", alignItems:"center", position:"sticky", top:0, zIndex:10, borderRadius:"8px 8px 0 0" }}>
          <div>
            <div style={{ fontFamily:DM, fontSize:10, letterSpacing:3, textTransform:"uppercase", color:C.gold, marginBottom:3 }}>Secure Admin · Unified Solutions Inc.</div>
            <div style={{ fontFamily:PF, fontSize:20, color:C.white }}>Admin Dashboard</div>
          </div>
          <div style={{ display:"flex", gap:8, alignItems:"center" }}>
            <span style={{ fontFamily:DM, fontSize:12, color:"rgba(255,255,255,0.5)" }}>{records.length} assessment{records.length!==1?"s":""}</span>
            <button onClick={onClose} style={{ background:C.gold, border:"none", color:C.white, fontFamily:DM, fontWeight:700, fontSize:12, padding:"7px 16px", borderRadius:4, cursor:"pointer" }}>Close ×</button>
          </div>
        </div>
        {/* API keys bar — two rows */}
        <div style={{ background:C.navyMid, borderBottom:"1px solid rgba(255,255,255,0.1)", padding:"12px 28px", display:"flex", flexDirection:"column", gap:8 }}>
          {/* Row 1: Anthropic */}
          <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>

            <input type="password" value={apiKey} onChange={e=>{const v=e.target.value.trim();setApiKey(v);localStorage.setItem("us-api-key",v);}} placeholder="sk-ant-api03-..." style={{ flex:1, minWidth:200, padding:"5px 10px", fontFamily:DM, fontSize:12, background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:3, color:"white" }}/>
            {apiKey && <span style={{ fontFamily:DM, fontSize:11, color:"#5DE09A", flexShrink:0 }}>✓ Saved</span>}

function AdminLoginModal() {
  const { setShowAdminModal, handleAdminLogin } = useSite();
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [attempts, setAttempts] = useState(() => {
    try { return JSON.parse(localStorage.getItem('us-login-attempts') || '{"count":0,"lockUntil":0}'); }
    catch(e) { return {count:0, lockUntil:0}; }
  });
  const [loading, setLoading] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { inputRef.current?.focus(); }, []);

  const isLocked = attempts.lockUntil > Date.now();
  const lockMins = Math.ceil((attempts.lockUntil - Date.now()) / 60000);

  async function attempt() {
    if (isLocked || loading || !pin) return;
    setLoading(true);
    const ok = await handleAdminLogin(pin);
    if (ok) {
      localStorage.setItem('us-login-attempts', JSON.stringify({count:0, lockUntil:0}));
    } else {
      const newCount = attempts.count + 1;
      const lockUntil = newCount >= 5 ? Date.now() + 900000 : 0;
      const newAttempts = {count: newCount, lockUntil};
      localStorage.setItem('us-login-attempts', JSON.stringify(newAttempts));
      setAttempts(newAttempts);
      setError(newCount >= 5 ? 'Too many attempts. Locked for 15 minutes.' : `Incorrect PIN. ${5 - newCount} attempt${5-newCount===1?'':'s'} remaining.`);
      setPin('');
    }
    setLoading(false);
  }

  return (
    <div style={{ position:"fixed", inset:0, zIndex:1000, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"center", justifyContent:"center" }}
      onClick={e => e.target === e.currentTarget && setShowAdminModal(false)}>
      <div style={{ background:C.navy, borderRadius:8, padding:40, width:340, boxShadow:"0 32px 80px rgba(0,0,0,0.6)", border:`1px solid ${C.navyLight}` }}>
        <div style={{ fontFamily:DM, fontSize:11, letterSpacing:3, textTransform:"uppercase", color:C.gold, marginBottom:16 }}>Unified Solutions Inc.</div>
        <div style={{ fontFamily:PF, fontSize:22, color:C.white, marginBottom:8 }}>Admin Access</div>
        <div style={{ fontFamily:DM, fontSize:14, color:"rgba(255,255,255,0.4)", marginBottom:28 }}>Session expires after 1 hour of inactivity.</div>
        {isLocked ? (
          <div style={{ fontFamily:DM, fontSize:16, color:"#E07070", background:"rgba(155,34,38,0.2)", borderRadius:4, padding:"12px 16px" }}>
            Access locked. Try again in {lockMins} minute{lockMins===1?'':'s'}.
          </div>
        ) : (
          <>
            <input
              ref={inputRef} type="password" value={pin}
              onChange={e => { setPin(e.target.value); setError(''); }}
              onKeyDown={e => e.key==='Enter' && attempt()}
              placeholder="Enter admin PIN"
              style={{ width:"100%", padding:"12px 14px", fontFamily:DM, fontSize:16, background:"rgba(255,255,255,0.08)", border:`1px solid ${error ? '#E07070' : 'rgba(255,255,255,0.15)'}`, borderRadius:4, color:C.white, letterSpacing:4, marginBottom:8, outline:"none" }}
            />
            {error && <div style={{ fontFamily:DM, fontSize:14, color:"#E07070", marginBottom:12 }}>{error}</div>}
            <button onClick={attempt} disabled={loading || !pin} style={{ width:"100%", background:C.gold, color:C.white, border:"none", borderRadius:4, padding:"12px", fontFamily:DM, fontWeight:700, fontSize:16, cursor: loading||!pin?"not-allowed":"pointer", opacity: loading||!pin?0.6:1, marginTop:8 }}>
              {loading ? "Verifying..." : "Unlock"}
            </button>
            <button onClick={() => setShowAdminModal(false)} style={{ width:"100%", background:"none", border:"none", fontFamily:DM, fontSize:14, color:"rgba(255,255,255,0.3)", cursor:"pointer", marginTop:12, padding:4 }}>Cancel</button>
          </>
        )}
      </div>
    </div>
  );
}

function buildReportHTML(sorted, email) {
  const date = new Date().toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" });

  const domainColor = id => DOMAINS.find(d => d.id === id)?.color || "#0B1D30";
  const scoreLabel  = s => s >= 75 ? "Strong" : s >= 50 ? "Developing" : "Priority Area";
  const scoreLabelColor = s => s >= 75 ? "#1B5E35" : s >= 50 ? "#7C5C00" : "#7A1C20";
  const scoreCtx = (insight, score) => score < 50 ? insight.scoreContext.low : score < 75 ? insight.scoreContext.mid : insight.scoreContext.high;

  // Score bars — pure inline HTML table (reliable in all PDF engines)
  const scoreBars = sorted.map((d, i) => {
    const color = domainColor(d.id);
    const lbl   = scoreLabel(d.score);
    const lblC  = scoreLabelColor(d.score);
    const badge = i === 0 ? " · Primary" : i === 1 ? " · Secondary" : "";
    return `
      <tr>
        <td style="padding:7px 10px 7px 0;font-family:'DM Sans',sans-serif;font-size:12pt;color:#1E1E1E;white-space:nowrap;width:200px;">
          ${d.label}${badge ? `<span style="font-size:9pt;color:${color};"> ${badge}</span>` : ""}
        </td>
        <td style="padding:7px 12px 7px 0;width:240px;">
          <div style="background:#EDE8DF;border-radius:3px;height:10px;width:100%;">
            <div style="background:${color};width:${d.score}%;height:10px;border-radius:3px;"></div>
          </div>
        </td>
        <td style="padding:7px 12px 7px 0;font-family:'DM Sans',sans-serif;font-size:12pt;font-weight:600;color:${color};width:50px;">${d.score}</td>
        <td style="padding:7px 0;font-family:'DM Sans',sans-serif;font-size:9pt;font-weight:700;color:${lblC};background:${lblC}18;border:1px solid ${lblC}40;border-radius:10px;padding:2px 10px;white-space:nowrap;">${lbl}</td>
      </tr>`;
  }).join("");

  // Deep-dive sections for primary + secondary
  const domainSections = [sorted[0], sorted[1]].map((d, idx) => {
    const insight = DOMAIN_INSIGHTS[d.id];
    if (!insight) return "";
    const color    = domainColor(d.id);
    const ctx      = scoreCtx(insight, d.score);
    const related  = ARTICLES.filter(a => insight.articleDomains.includes(a.domain));
    const qRows    = insight.questions.map(q =>
      `<tr><td style="padding:2px 10px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:14pt;color:${color};vertical-align:top;line-height:1;">Q</td>

        <strong style="color:#0B1D30;">${a.title}</strong>
        <span style="color:#6B7280;"> — ${a.tag} · ${a.mins} min · unifiedsolutionsinc.com${a.url || "/resources"}</span>
       </div>`
    ).join("");

    return `
      ${idx === 1 ? '<div style="page-break-before:always;padding-top:8px;"></div>' : ""}

      <!-- Domain section header -->
      <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:0;">

          <td style="background:${color};padding:12px 18px;border-radius:6px 6px 0 0;">

          </td>
        </tr>
      </table>

      <div style="border:1px solid ${color}40;border-top:none;border-radius:0 0 6px 6px;padding:18px 18px 8px;margin-bottom:24px;">

        <!-- Score context -->
        <div style="margin-bottom:16px;">

        <!-- Exploration questions -->
        <div style="margin-bottom:16px;">

        <div style="margin-bottom:14px;">
          <div style="font-family:'DM Sans',sans-serif;font-size:9pt;letter-spacing:2px;text-transform:uppercase;color:#0B1D30;font-weight:700;margin-bottom:10px;">Relevant reading from the practice</div>

        <!-- Further reading -->
        <div style="border-top:1px solid ${color}20;padding-top:12px;margin-top:4px;">
          <span style="font-family:'DM Sans',sans-serif;font-size:9pt;letter-spacing:2px;text-transform:uppercase;color:#6B7280;font-weight:700;">📚 For deeper exploration — </span>
          <span style="font-family:'DM Sans',sans-serif;font-size:11pt;color:#6B7280;">${insight.readMore}</span>
        </div>
      </div>`;
  }).join("");

  return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leadership Pressure Point Assessment — Unified Solutions Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <tr>

        <div style="font-family:'Playfair Display',Georgia,serif;font-size:22pt;font-weight:700;color:#0B1D30;letter-spacing:-0.3px;margin-bottom:4px;">Leadership Pressure Point Assessment</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:11pt;color:#6B7280;margin-bottom:2px;">Julian C. Johnson, ICF PCC · ACTC · Unified Solutions Inc.</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:11pt;color:#6B7280;">unifiedsolutionsinc.com · contact@unifiedsolutionsinc.com · 952.594.8611</div>
      </td>

function openPrintReport(sorted, email) {

                              <span key={id} style={{ fontFamily:DM, fontSize:9, color:C.muted, background:C.creamDark, border:`1px solid ${C.border}`, borderRadius:8, padding:"2px 6px", letterSpacing:0.5 }}>{aud.label}</span>
                            ) : null;
                          })}
                        </div>
                        {!isPlanned && <span style={{ fontFamily:DM, fontSize:13, fontWeight:600, color:pillar.color }}>Read →</span>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </section>

      {/* Email signup */}
      <section style={{ background:C.creamDark, padding:"56px 24px", borderTop:`1px solid ${C.border}` }}>
        <div style={{ maxWidth:520, margin:"0 auto", textAlign:"center" }}>
          <h2 style={{ fontFamily:PF, fontSize:28, color:C.navy, margin:"0 0 12px" }}>New articles when they're worth reading.</h2>
          <p style={{ fontFamily:DM, fontSize:15, color:C.muted, margin:"0 0 24px", lineHeight:1.7 }}>Frameworks, assessment perspectives, and development thinking from 1,200+ hours of coaching. No content calendar filler.</p>
          {signed ? (
            <div style={{ fontFamily:DM, fontSize:15, color:C.green, fontWeight:600 }}>✓ You're on the list.</div>
          ) : (
            <div style={{ display:"flex", gap:8 }}>
              <input value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com"
                id="newsletter-email" aria-label="Email address for leadership insights newsletter"
                style={{ flex:1, padding:"12px 16px", fontFamily:DM, fontSize:16, border:`1px solid ${C.border}`, borderRadius:2, outline:"none", background:C.white }} />
              <Btn onClick={() => email && setSigned(true)}>Join</Btn>
            </div>
          )}
        </div>
      </section>
    </div>
  );
}

// ASSESSMENT PAGE
// ═══════════════════════════════════════════════════════
function AssessmentPage() {
  const { setPage, content, updateContent, isAdmin, setShowAdminModal } = useSite();
  const [answers, setAnswers] = useState({});
  const [step, setStep] = useState("intro"); // intro | quiz | results
  // Generated fresh each session — randomized domain order, question selection, option order
  const [sessionQuestions, setSessionQuestions] = useState([]);
  const [email, setEmail] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [savedMsg, setSavedMsg] = useState(null);
  const [showAdmin, setShowAdmin] = useState(false);
  const [consentGiven, setConsentGiven] = useState(false);
  const current  = Object.keys(answers).length;
  const totalQs  = sessionQuestions.length || 18;
  const progress = Math.round((current / totalQs) * 100);

  function computeScores() {
    const scores = {};
    DOMAINS.forEach(d => {
      const qs = sessionQuestions.filter(q => q.domain === d.id);
      if (qs.length === 0) { scores[d.id] = 50; return; }
      const total = qs.reduce((acc, q) => acc + (answers[q.sessionId] ?? 0), 0);
      scores[d.id] = Math.round(((total - qs.length) / (qs.length * 3)) * 100);
    });
    return scores;
  }

  async function saveResults(scores) {
    try {
      const record = { timestamp: new Date().toISOString(), email, scores, answers };
      const existing = [];
      try {
        const r = await storage.get("assessment-results");
        if (r) existing.push(...JSON.parse(r.value));
      } catch (e) {}
      existing.push(record);
      await storage.set("assessment-results", JSON.stringify(existing));
      setSavedMsg("Results saved ✓");
    } catch (e) { setSavedMsg("Save failed — storage unavailable"); }
  }

  const allAnswered = sessionQuestions.length > 0 && current === sessionQuestions.length;

  // Admin panel access now secured by global admin session
  if (showAdmin && isAdmin) return <AdminPanel initialTab="crm" onClose={() => setShowAdmin(false)} />;
  if (showAdmin && !isAdmin) { setShowAdmin(false); setShowAdminModal(true); }

  if (step === "intro") return (
    <div style={{ paddingTop:64, background:C.cream, minHeight:"100vh" }}>
      <section style={{ background:C.navy, padding:"80px 24px 64px" }}>
        <div style={{ maxWidth:720, margin:"0 auto", textAlign:"center" }}>
          <div style={{ fontFamily:DM, fontSize:12, letterSpacing:3, color:C.gold, textTransform:"uppercase", marginBottom:16 }}>Free Diagnostic</div>
          <EditableBlock text={content.assessment?.headline||"Where is the gap between where you are and where you need to be costing you most?"} onSave={v=>updateContent("assessment.headline",v)} fieldName="assessment.headline" tag="h1" style={{ fontFamily:PF, fontSize:44, color:C.white, margin:"0 0 20px", letterSpacing:-0.5 }} />
          <EditableBlock text={content.assessment?.subtitle||"18 behaviorally-anchored questions across 6 validated leadership domains. No right answers — honest answers only. Under 8 minutes. Free, no email required to see your result."} onSave={v=>updateContent("assessment.subtitle",v)} fieldName="assessment.subtitle" tag="p" style={{ fontFamily:DM, fontSize:18, color:"rgba(255,255,255,0.65)", lineHeight:1.7, margin:"0 0 40px" }} />
          <div style={{ display:"flex", gap:32, justifyContent:"center", marginBottom:40 }}>
            {[["18","Questions"],["6","Domains"],["<8 min","To complete"],["Free","No signup"]].map(([v,l]) => (
              <div key={l} style={{ textAlign:"center" }}>
                <div style={{ fontFamily:PF, fontSize:28, color:C.gold, fontWeight:700 }}>{v}</div>
                <div style={{ fontFamily:DM, fontSize:12, letterSpacing:2, color:"rgba(255,255,255,0.5)", textTransform:"uppercase" }}>{l}</div>
              </div>
            ))}
          </div>
          
          {/* AI Disclosure — EU AI Act Art.50, California SB 942, ICF Ethics */}
          <div style={{ background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:4, padding:"14px 20px", margin:"0 auto 24px", maxWidth:560, textAlign:"left" }}>
            <div style={{ fontFamily:DM, fontSize:12, fontWeight:700, color:C.gold, letterSpacing:1, marginBottom:6 }}>🤖 AI-Assisted Processing</div>
            <p style={{ fontFamily:DM, fontSize:13, color:"rgba(255,255,255,0.65)", lineHeight:1.65, margin:0 }}>
              This assessment uses AI to help generate personalized coaching insights. If you share your email, your scores are processed by Anthropic's API and stored in our secure coaching CRM. No automated decisions are made about you — all coaching involves a human coach. See our{" "}
              <button onClick={() => setPage("privacy")} style={{ background:"none", border:"none", color:C.gold, fontFamily:DM, fontSize:13, cursor:"pointer", textDecoration:"underline", padding:0 }}>Privacy Policy</button>.
            </p>
          </div>
          <Btn onClick={() => { const s = generateAssessmentSession(); setSessionQuestions(s); setAnswers({}); setStep("quiz"); }} style={{ fontSize:17, padding:"16px 48px" }}>Begin Assessment</Btn>
          {isAdmin && (
            <div style={{ marginTop:20 }}>
              <button onClick={() => setShowAdmin(true)} style={{ background:"rgba(200,147,58,0.15)", border:`1px solid ${C.gold}40`, borderRadius:2, fontFamily:DM, fontSize:13, color:C.goldDark, padding:"6px 16px", cursor:"pointer", letterSpacing:1 }}>
                📊 View Assessment CRM
              </button>
            </div>
          )}

        </div>
      </section>
      <section style={{ padding:"64px 24px" }}>
        <div style={{ maxWidth:800, margin:"0 auto", display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:24 }}>
          {DOMAINS.map(d => (
            <div key={d.id} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:4, padding:24 }}>
              <div style={{ fontFamily:DM, fontSize:24, marginBottom:12, color:d.color }}>{d.icon}</div>
              <div style={{ fontFamily:PF, fontSize:18, color:C.navy, fontWeight:600, marginBottom:8 }}>{d.label}</div>
              <div style={{ fontFamily:DM, fontSize:16, color:C.muted, lineHeight:1.6 }}>{d.desc}</div>
            </div>
          ))}
        </div>
      </section>
    </div>
  );

  if (step === "quiz") {
    const qIndex = sessionQuestions.findIndex(q => !answers[q.sessionId]);
    const q = qIndex >= 0 ? sessionQuestions[qIndex] : null;
    const domain = q ? DOMAINS.find(d => d.id === q.domain) : null;
    return (
      <div style={{ paddingTop:64, background:C.cream, minHeight:"100vh" }}>
        <div style={{ background:C.white, borderBottom:`1px solid ${C.border}`, padding:"16px 24px" }}>
          <div style={{ maxWidth:720, margin:"0 auto", display:"flex", alignItems:"center", gap:16 }}>
            <span style={{ fontFamily:DM, fontSize:14, color:C.muted, whiteSpace:"nowrap" }}>Question {current+1} of {totalQs}</span>
            <div style={{ flex:1, background:C.creamDark, borderRadius:2, height:6 }}>
              <div style={{ width:`${progress}%`, height:"100%", background:C.gold, borderRadius:2, transition:"width 0.3s" }} />
            </div>
            <span style={{ fontFamily:DM, fontSize:14, color:C.gold, fontWeight:600, whiteSpace:"nowrap" }}>{progress}%</span>
          </div>
        </div>
        {!allAnswered && q ? (
          <section style={{ padding:"64px 24px" }}>
            <div style={{ maxWidth:640, margin:"0 auto" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:28 }}>
                <span style={{ fontFamily:DM, fontSize:20, color:domain.color }}>{domain.icon}</span>
                <span style={{ fontFamily:DM, fontSize:13, letterSpacing:2, color:domain.color, textTransform:"uppercase" }}>{domain.label}</span>
              </div>
              {/* AC6: ARIA live region — announces question progress to screen readers */}
              <div aria-live="polite" aria-atomic="true" style={{ position:"absolute", left:"-9999px", width:1, height:1, overflow:"hidden" }}>
                {`Question ${current+1} of ${totalQs} — ${domain?.label}`}
              </div>
              {/* AC3: tabIndex={-1} allows programmatic focus; outline:none hides focus ring from mouse */}
              <h2 style={{ fontFamily:PF, fontSize:26, color:C.navy, margin:"0 0 36px", lineHeight:1.4 }}>{q.text}</h2>
              {/* AC3: radiogroup role groups answer options semantically for screen readers */}
              <div role="radiogroup" aria-labelledby="quiz-question-label" style={{ display:"flex", flexDirection:"column", gap:12 }}>
                <span id="quiz-question-label" style={{ display:"none" }}>{q.text}</span>
                {q.options.map((opt,i) => (
                  <button key={i} role="radio" aria-checked={false}
                    onClick={() => { setAnswers(prev => ({...prev, [q.sessionId]: opt.score})); }}
                    style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:4, padding:"18px 24px", textAlign:"left", cursor:"pointer", fontFamily:DM, fontSize:16, color:C.text, lineHeight:1.55, transition:"all 0.15s" }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = C.gold; e.currentTarget.style.background = C.goldPale; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.background = C.white; }}>
                    <span style={{ color:C.gold, marginRight:10, fontWeight:700 }}>{["A","B","C","D"][i]}.</span> {opt.text}
                  </button>
                ))}
              </div>
            </div>
          </section>
        ) : (
          <section style={{ padding:"64px 24px", textAlign:"center" }}>
            <div style={{ maxWidth:500, margin:"0 auto" }}>
              <h2 style={{ fontFamily:PF, fontSize:32, color:C.navy, margin:"0 0 20px" }}>All 18 questions complete.</h2>
              <Btn onClick={() => setStep("results")} style={{ fontSize:16, padding:"14px 40px" }}>See My Results</Btn>
            </div>
          </section>
        )}
      </div>
    );
  }

  if (step === "results") {
    const scores = computeScores();
    const sorted = DOMAINS.map(d => ({...d, score:scores[d.id]})).sort((a,b) => a.score - b.score);
    // AC5: Score label helper for ARIA
    const scoreLabel = (score) => score >= 75 ? "Strong" : score >= 50 ? "Developing" : "Priority Area";
    const primary = sorted[0];
    const secondary = sorted[1];
    return (
      <div style={{ paddingTop:64, background:C.cream, minHeight:"100vh" }}>
        <section style={{ background:C.navy, padding:"64px 24px 48px" }}>
          <div style={{ maxWidth:800, margin:"0 auto", textAlign:"center" }}>
            <div style={{ fontFamily:DM, fontSize:12, letterSpacing:3, color:C.gold, textTransform:"uppercase", marginBottom:12 }}>Your Results</div>
            <h1 style={{ fontFamily:PF, fontSize:40, color:C.white, margin:"0 0 12px" }}>Leadership Pressure Point Assessment</h1>
            <p style={{ fontFamily:DM, fontSize:17, color:"rgba(255,255,255,0.6)", marginBottom:4 }}>Primary pressure point: <strong style={{ color:C.gold }}>{primary.label}</strong></p>
            <p style={{ fontFamily:DM, fontSize:16, color:"rgba(255,255,255,0.4)" }}>Secondary: {secondary.label}</p>
          </div>
        </section>
        <section style={{ padding:"56px 24px" }}>
          <div style={{ maxWidth:800, margin:"0 auto" }}>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:16, marginBottom:40 }}>
              {sorted.map(d => (
                <div key={d.id} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:4, padding:24, borderLeft: d.id===primary.id ? `4px solid ${d.color}` : d.id===secondary.id ? `4px solid ${d.color}40` : `4px solid ${C.border}` }}>

                    <span style={{ fontFamily:PF, fontSize:17, color:C.navy, fontWeight:600 }}>{d.icon} {d.label}</span>
                    <ScoreBadge score={d.score} />
                  </div>
                  <div
                    role="progressbar"
                    aria-valuenow={d.score} aria-valuemin={0} aria-valuemax={100}
                    aria-label={`${d.label}: ${d.score} out of 100 — ${scoreLabel(d.score)}`}
                    style={{ background:C.creamDark, borderRadius:2, height:8, marginBottom:6 }}>
                    <div style={{ width:`${d.score}%`, height:"100%", background:d.color, borderRadius:2, transition:"width 1s ease" }} />
                  </div>
                  <div style={{ fontFamily:DM, fontSize:13, color:C.muted }}>{d.score}/100</div>
                </div>
              ))}
            </div>
            {/* Save / Print button */}
            <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:20 }}>
              <button
                onClick={() => openPrintReport(sorted, email)}

                onMouseEnter={e => { e.currentTarget.style.background=C.navy; e.currentTarget.style.color=C.white; e.currentTarget.style.borderColor=C.navy; }}
                onMouseLeave={e => { e.currentTarget.style.background=C.white; e.currentTarget.style.color=C.navy; e.currentTarget.style.borderColor=C.border; }}>
                <span>⬇</span> Save as PDF / Print Report
              </button>
            </div>

            {/* Domain insight cards — primary then secondary */}

              <div style={{ fontFamily:DM, fontSize:11, letterSpacing:2, textTransform:"uppercase", color:C.muted, marginBottom:16 }}>Your Results In Depth</div>

            <div style={{ background:C.navyMid, borderRadius:4, padding:36, textAlign:"center" }}>
              <EditableBlock text={content.assessment?.resultsCTA||"Get a personalized note from Julian."} onSave={v=>updateContent("assessment.resultsCTA",v)} fieldName="assessment.resultsCTA" tag="h3" style={{ fontFamily:PF, fontSize:24, color:C.white, margin:"0 0 12px" }} />

// MAIN APP
// ═══════════════════════════════════════════════════════
function UnifiedSolutions() {
  // ── URL-aware routing ────────────────────────────────────────────
  const [page, setPage] = useState(() => {
    const ROUTE_MAP = {
      '/':'home', '/about':'about', '/coaching':'coaching',
      '/resources':'resources', '/assessment':'assessment',
      '/book':'book', '/book-a-call':'book',   // Squarespace legacy alias
      '/privacy':'privacy', '/privacy-policy':'privacy'
    };
    // ── GitHub Pages SPA redirect recovery ────────────────────────────
    // 404.html stores the intended URL in sessionStorage before redirecting
    // to /. We read it here, restore the browser URL, and route correctly.
    const stored = sessionStorage.getItem('spa-redirect');
    if (stored) {
      sessionStorage.removeItem('spa-redirect');
      try {
        const intendedPath = new URL(stored).pathname;
        // If it's a real SPA route, restore the URL and route to it
        if (ROUTE_MAP[intendedPath]) {
          if (window.location.protocol !== "file:") { window.history.replaceState(null, null, intendedPath); }
          return ROUTE_MAP[intendedPath];
        }
        // Unknown path (e.g. /articles/* that 404'd) — stay home
      } catch(e) {}
    }
    return ROUTE_MAP[window.location.pathname] || 'home';
  });
  const [content, setContent] = useState(DEFAULT_CONTENT);

  // ── Secure Admin Session ─────────────────────────────────────────
  // Entry: Ctrl+Shift+A (no visible UI in public nav)
  // Auth:  SHA-256 hashed PIN comparison, lockout after 5 fails
  // Session: sessionStorage (auto-clears on browser close), 1hr timeout
  const [adminSession, setAdminSession] = useState(() => {
    try {
      const s = JSON.parse(sessionStorage.getItem('us-admin-session') || 'null');
      return s && s.expires > Date.now() ? s : null;
    } catch(e) { return null; }
  });
  const [editMode, setEditMode] = useState(false);
  const [showAdminModal, setShowAdminModal] = useState(false);

  const isAdmin = adminSession && adminSession.expires > Date.now();

  // ── Secret keyboard shortcut ─────────────────────────────────────
  useEffect(() => {
    const onKey = (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'A') {
        e.preventDefault();
        if (isAdmin) { setEditMode(m => !m); }
        else { setShowAdminModal(true); }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [isAdmin]);

  // ── PIN hash utility (shared by login + changer) ─────────────────────────
  async function computePinHash(pin) {
    const buf = await crypto.subtle.digest('SHA-256',
      new TextEncoder().encode('unified_solutions_2026' + pin)
    );
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // Hardcoded fallback — used until you set a new PIN via the admin panel Security tab
  const ADMIN_HASH_FALLBACK = '2fbfec39f6fd0c978b6dc9b0a1beeadc5b2c1da49d20f514e7ab8cf1004ac3d2';

  async function handleAdminLogin(pin) {
    // Load user-defined hash from storage — falls back to ADMIN_HASH_FALLBACK
    let activeHash = ADMIN_HASH_FALLBACK;
    try {
      const stored = await storage.get('admin-pin-hash');
      if (stored && stored.value) activeHash = stored.value;
    } catch(e) {}

    const hash = await computePinHash(pin);
    if (hash === activeHash) {
      const session = { loggedIn: true, expires: Date.now() + 3600000, loginTime: new Date().toISOString() };
      sessionStorage.setItem('us-admin-session', JSON.stringify(session));
      setAdminSession(session);
      setShowAdminModal(false);
      return true;
    }
    return false;
  }

  
  function handleAdminLogout() {
    sessionStorage.removeItem('us-admin-session');
    setAdminSession(null);
    setEditMode(false);
  }

  // Load Google Fonts via <link> (faster than @import, avoids FOUC)
  useEffect(() => {
    if (document.getElementById("usi-google-fonts")) return;
    const link = document.createElement("link");
    link.id  = "usi-google-fonts";
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap";
    document.head.appendChild(link);
  }, []);

  // Load saved content
  useEffect(() => {
    (async () => {
      try {
        const r = await storage.get("cms-content");
        if (r) setContent(JSON.parse(r.value));
      } catch (e) {}
    })();
  }, []);

  // P5: GDPR Art.5(1)(e) — auto-purge assessment results older than 24 months
  useEffect(() => {
    try {
      const existing = JSON.parse(localStorage.getItem('assessment-results') || '[]');
      const cutoff = new Date();
      cutoff.setMonth(cutoff.getMonth() - 24);
      const fresh = existing.filter(r => new Date(r.timestamp) > cutoff);
      if (fresh.length !== existing.length) {
        localStorage.setItem('assessment-results', JSON.stringify(fresh));
      }
    } catch(e) {}
  }, []);

  // ── Sync URL + update meta tags on page change ───────────
  useEffect(() => {
    const urls = {
      home:'/', about:'/about', coaching:'/coaching',
      resources:'/resources', assessment:'/assessment', book:'/book', privacy:'/privacy'
    };
    const newUrl = urls[page] || '/';
    if (window.location.pathname !== newUrl) {
      window.history.pushState({ page }, '', newUrl);
    }
    // Update document title
    const meta = PAGE_META[page] || PAGE_META.home;
    document.title = meta.title;
    // Update meta description
    let descTag = document.querySelector('meta[name="description"]');
    if (!descTag) { descTag = document.createElement('meta'); descTag.name = 'description'; document.head.appendChild(descTag); }
    descTag.content = meta.description;
    // Update OG tags
    const ogTitle = document.querySelector('meta[property="og:title"]');
    const ogDesc  = document.querySelector('meta[property="og:description"]');
    if (ogTitle) ogTitle.content = meta.title;
    if (ogDesc)  ogDesc.content  = meta.description;
    window.scrollTo(0, 0);
  }, [page]);

  // ── Handle browser back / forward buttons ────────────
  useEffect(() => {
    const pageMap = {
      '/':'home', '/about':'about', '/coaching':'coaching',
      '/resources':'resources', '/assessment':'assessment', '/book':'book', '/privacy':'privacy'
    };
    const onPop = () => setPage(pageMap[window.location.pathname] || 'home');
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  function updateContent(path, value) {
    setContent(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const keys = path.split(".");
      let obj = next;
      for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
      obj[keys[keys.length-1]] = value;
      return next;
    });
  }

  async function saveContent() {
    try {
      await storage.set("cms-content", JSON.stringify(content));
      setEditMode(false);
    } catch (e) { alert("Storage unavailable — changes not saved."); }
  }

  const ctx = { page, setPage, editMode, setEditMode, content, updateContent, saveContent, isAdmin, handleAdminLogin, handleAdminLogout, showAdminModal, setShowAdminModal };

  return (
    <Ctx.Provider value={ctx}>
      <div style={{ fontFamily: DM, background:C.cream, color:C.text, minHeight:"100vh" }}>
        {showAdminModal && <AdminLoginModal />}
        {isAdmin && <AdminToolbar />}
        <Nav />
        <main id="main-content" style={{ paddingTop: editMode ? 0 : 0 }}>
          {page === "home"       && <HomePage />}
          {page === "about"      && <AboutPage />}
          {page === "coaching"   && <CoachingPage />}
          {page === "resources"  && <ResourcesPage />}
          {page === "assessment" && <AssessmentPage />}
          {page === "book"       && <BookPage />}
          {page === "privacy"    && <PrivacyPolicyPage />}
        </main>
        <Footer />
      </div>
    </Ctx.Provider>
  );
}

const _rootEl = document.getElementById('root');
const _root = ReactDOM.createRoot(_rootEl);
_root.render(React.createElement(UnifiedSolutions));

  </script>
</body>
</html>
