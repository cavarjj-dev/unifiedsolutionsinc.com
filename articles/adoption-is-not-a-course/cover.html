<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adoption cover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0B1D30}
  .cover{
    width:1200px;height:630px;background:#0B1D30;color:#F5F3EE;
    position:relative;overflow:hidden;
    font-family:'DM Sans',sans-serif;
  }
  .rule{position:absolute;left:64px;top:0;bottom:0;width:4px;background:#C4903A}
  .kicker{
    position:absolute;left:96px;top:78px;
    font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:#C4903A;font-weight:600;
  }
  h1{
    position:absolute;left:96px;right:80px;top:140px;margin:0;
    font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:58px;line-height:1.12;color:#fff;
    max-width:18ch;
  }
  .sub{
    position:absolute;left:96px;right:120px;bottom:118px;
    font-size:20px;line-height:1.45;color:rgba(245,243,238,.72);max-width:34ch;
  }
  .foot{
    position:absolute;left:96px;right:64px;bottom:48px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:rgba(245,243,238,.45);
  }
</style>
</head>
<body>
<div class="cover">
  <div class="rule"></div>
  <div class="kicker">Latest · Strategic Clarity</div>
  <h1>The adoption gap no dashboard will show you</h1>
  <div class="sub">Anticipation from the top is not adoption. Leaders need space to connect the tools to what is real.</div>
  <div class="foot">
    <span>Julian Johnson · ICF PCC</span>
    <span>Unified Solutions Inc.</span>
  </div>
</div>
</body>
</html>
