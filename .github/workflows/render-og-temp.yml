name: Render temporary OG asset
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-og-temp.yml

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render OG image
        run: |
          mkdir -p assets
          cat > /tmp/og.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
            <rect width="1200" height="630" fill="#f7f5ee"/>
            <rect width="1200" height="8" fill="#c4963b"/>
            <rect width="20" height="562" y="8" fill="#0b1d30"/>
            <ellipse cx="1040" cy="160" rx="430" ry="300" fill="#eee6d7"/>
            <ellipse cx="120" cy="505" rx="430" ry="260" fill="#e4e3df"/>
            <text x="72" y="115" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#c4963b">FLAGSHIP MODEL · UNIFIED SOLUTIONS</text>
            <text x="72" y="225" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#0b1d30">Honest Calibration™</text>
            <rect x="72" y="250" width="350" height="5" fill="#c4963b"/>
            <text x="72" y="300" font-family="Georgia,serif" font-size="26" fill="#173750">A five-phase room where senior leaders tell the truth,</text>
            <text x="72" y="335" font-family="Georgia,serif" font-size="26" fill="#173750">calibrate under pressure, and leave with next-week</text>
            <text x="72" y="370" font-family="Georgia,serif" font-size="26" fill="#173750">actions plus 30/60/90 check-ins.</text>
            <g font-family="Arial,sans-serif" font-size="16" fill="#173750" stroke="#173750" stroke-width="2">
              <rect x="72" y="424" width="108" height="38" rx="19" fill="none"/><text x="88" y="449" stroke="none">1 Ground</text>
              <rect x="194" y="424" width="98" height="38" rx="19" fill="none"/><text x="211" y="449" stroke="none">2 Name</text>
              <rect x="306" y="424" width="86" height="38" rx="19" fill="none"/><text x="327" y="449" stroke="none">3 Push</text>
              <rect x="406" y="424" width="112" height="38" rx="19" fill="none"/><text x="423" y="449" stroke="none">4 Saturate</text>
              <rect x="532" y="424" width="111" height="38" rx="19" fill="none"/><text x="550" y="449" stroke="none">5 Actions</text>
            </g>
            <rect y="570" width="1200" height="60" fill="#0b1d30"/>
            <text x="72" y="607" font-family="Arial,sans-serif" font-size="17" fill="#f7f5ee">Unified Solutions Inc. · ICF PCC · ACTC · Emeritus Educator & ExecOnline Facilitator</text>
            <text x="1040" y="607" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c4963b">unifiedsolutionsinc.com</text>
          </svg>
          SVG
          convert -background none /tmp/og.svg -quality 94 assets/og-honest-calibration.jpg
          test "$(wc -c < assets/og-honest-calibration.jpg)" -gt 3039
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-honest-calibration.jpg
          git commit -m "fix: restore full-quality Honest Calibration OG image"
          git push
