name: Ship HC SEO finalize
on:
  workflow_dispatch:
  push:
    branches: [publish/hc-full-html-seo-20260921]
    paths:
      - scripts/ship_hc_patch.py
      - .github/workflows/ship-hc-seo-finalize.yml
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/hc-full-html-seo-20260921
      - name: Apply SPA nav/footer Honest Calibration rename
        run: python3 scripts/ship_hc_patch.py
      - name: Ensure OG jpeg exists
        run: |
          mkdir -p assets
          if [ ! -f assets/og-honest-calibration.jpg ] || [ "$(wc -c < assets/og-honest-calibration.jpg)" -lt 1000 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            ffmpeg -y -f lavfi -i color=c=0x0B1D30:s=1200x630 \
              -vf "drawtext=text='Honest Calibration':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=(h-text_h)/2" \
              -frames:v 1 assets/og-honest-calibration.jpg || \
            ffmpeg -y -f lavfi -i color=c=0x0B1D30:s=1200x630 -frames:v 1 assets/og-honest-calibration.jpg
          fi
          ls -la assets/og-honest-calibration.jpg
          file assets/og-honest-calibration.jpg
      - name: Cleanup incomplete og-parts and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets/og-parts
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "ship: Honest Calibration™ SPA nav/footer + OG image"
            git push
          fi
