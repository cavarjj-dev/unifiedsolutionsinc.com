# ═══════════════════════════════════════════════════════════
# Unified Solutions Inc. — Netlify Configuration
# ═══════════════════════════════════════════════════════════

[build]
  publish = "."          # serve from repo root (no build step needed)

# ── SPA URL Routing ─────────────────────────────────────────
# Each rule below lets visitors land on clean URLs directly
# (e.g. unifiedsolutionsinc.com/about) without a 404,
# AND ensures Netlify Analytics tracks each page separately.
# status = 200 means "serve index.html silently at this URL"
# (not a redirect — the URL stays as /about in the browser)

[[redirects]]
  from   = "/about"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/coaching"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/resources"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/assessment"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/book"
  to     = "/index.html"
  status = 200

# ── Security Headers ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "SAMEORIGIN"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"
    # Content Security Policy — allows CDN scripts, Google Fonts, Anthropic API
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.anthropic.com https://mcp.notion.com https://calendly.com; frame-src https://calendly.com https://www.youtube.com https://player.vimeo.com;"

# ── Cache headers for static assets ─────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
