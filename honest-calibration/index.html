<body>
<script>
(async function () {
  try {
    var n = 4;
    var chunks = await Promise.all(Array.from({length: n}, function (_, i) {
      return fetch("./c" + i + ".txt").then(function (r) {
        if (!r.ok) throw new Error("c" + i + " " + r.status);
        return r.text();
      });
    }));
    var html = chunks.join("");
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.textContent = "Unable to load Honest Calibration™. Please refresh.";
    console.error(e);
  }
})();
</script>
