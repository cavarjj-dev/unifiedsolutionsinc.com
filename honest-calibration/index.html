<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="canonical" href="https://unifiedsolutionsinc.com/honest-calibration"/>
<title>Honest Calibration™ | Unified Solutions</title>
<meta name="description" content="Honest Calibration™ — a five-phase room where senior leaders tell the truth, calibrate under pressure, and leave with next-week actions plus 30/60/90 check-ins shaped to the outcome they’re moving."/>
</head>
<body>
<script>
(async function() {
  const n = 7;
  const chunks = await Promise.all(
    Array.from({length: n}, (_, i) => fetch("./b" + i + ".txt").then(r => {
      if (!r.ok) throw new Error("b" + i + " " + r.status);
      return r.text();
    }))
  );
  const b64 = chunks.join("");
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
})().catch(err => {
  document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Failed to load Honest Calibration™. <a href="/book">Inquire</a>.</p>';
  console.error(err);
});
</script>
<noscript><p style="font-family:system-ui;padding:2rem">Honest Calibration™ requires JavaScript. <a href="/book">Inquire</a>.</p></noscript>
</body>
</html>
