<div id="boot" style="font-family:system-ui,sans-serif;padding:2rem;color:#0B1D30">Loading Honest Calibration™…</div>
<script>
(async function(){
  const n=7;
  const chunks=await Promise.all(Array.from({length:n},(_,i)=>fetch('./b'+i+'.txt').then(r=>{if(!r.ok)throw new Error('b'+i);return r.text();})));
  const b64=chunks.join('');
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const stream=new Response(bin).body.pipeThrough(ds);
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('boot').textContent='Please refresh. ('+e+')';console.error(e);});
</script>
