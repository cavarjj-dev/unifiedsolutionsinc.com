ke-opacity="0.7" stroke-linecap="round"><path d="M880 172 A96 96 0 0 1 976 268" marker-end="url(#arrowGold)"/><path d="M976 268 A96 96 0 0 1 880 364" marker-end="url(#arrowGold)"/><path d="M880 364 A96 96 0 0 1 784 268" marker-end="url(#arrowGold)"/><path d="M784 268 A96 96 0 0 1 880 172" marker-end="url(#arrowGold)"/></g><!-- 5 Action as payoff (exit from loop) --><path d="M880 364 V392" stroke="#C4903A" stroke-width="2.25" marker-end="url(#arrowGold)"/><g filter="url(#softShadow)"><rect x="792" y="430" width="176" height="44" rx="22" fill="url(#hcGrad)"/></g><circle cx="818" cy="452" r="11" fill="#0B1D30"/><text x="818" y="456" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F7F3ED">5</text><text x="890" y="457" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="15" font-weight="700" fill="#0B1D30">Action</text><text x="560" y="520" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#5A6570">Many rooms → Unified Solutions → Honest Calibration™ → Action</text></svg>