<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unified Solutions Inc.</title>
  <script>
    var path = window.location.pathname;

    // ── Legacy URL aliases (Squarespace-era routes) ──────────────────
    var aliases = {
      '/book-a-call':      '/',
      '/privacy-policy':   '/?spa=%2Fprivacy',
      '/contractingopportunities': '/',
    };
    if (aliases[path]) {
      // For book-a-call: store the /book SPA route then go to index
      if (path === '/book-a-call') {
        sessionStorage.setItem('spa-redirect', window.location.origin + '/book');
      }
      window.location.replace('/');

    // ── Article paths: if we get here the file truly doesn't exist ───
    } else if (path.indexOf('/articles/') === 0) {
      window.location.replace('/resources');

    // ── SPA routes (/about, /coaching, etc.) ─────────────────────────
    } else {
      sessionStorage.setItem('spa-redirect', window.location.href);
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
